<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avia TV - World Class Streaming</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00f2ff; --bg: #030708; --card-bg: rgba(255, 255, 255, 0.03); 
      --card-border: rgba(255, 255, 255, 0.07); --star: #ffcc00; 
      --btn-bg: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      margin: 0; padding: 0; background: var(--bg); color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; 
    }

    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; background: rgba(3, 7, 8, 0.95); 
      backdrop-filter: blur(25px); z-index: 1000; border-bottom: 1px solid var(--card-border); 
    }
    
    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { 
      font-size: 20px; font-weight: 800; letter-spacing: 1px;
      background: linear-gradient(90deg, #00f2ff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 8px;
    }

    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .video-js { width: 100% !important; height: 100% !important; }

    /* চলন্ত লেখা (Ticker) আগের মতো স্পষ্ট */
    #ticker { background: rgba(255,255,255,0.02); padding: 6px 0; font-size: 11px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 25s linear infinite; white-space: nowrap; color: #bbb; }
    .ticker-content a { color: var(--primary); text-decoration: underline; font-weight: 800; }

    /* স্লিম ও ইউনিক বাটন ডিজাইন */
    .action-btns { display: flex; gap: 6px; padding: 12px 12px 6px 12px; }
    .rect-btn { 
      flex: 1; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; 
      gap: 5px; background: var(--btn-bg); border: 1px solid var(--card-border); 
      color: #e0e0e0; cursor: pointer; transition: 0.2s; font-size: 11px; font-weight: 600; text-decoration: none;
    }
    
    .btn-get-app { border-bottom: 2px solid #00ff88 !important; }
    .btn-get-app i { color: #00ff88; }
    .btn-contact { border-bottom: 2px solid #00a2ff !important; }
    .btn-contact i { color: #00a2ff; }
    .btn-refresh { border-bottom: 2px solid #ffaa00 !important; }
    .btn-refresh i { color: #ffaa00; }
    .btn-fullscreen { border-bottom: 2px solid #ff0066 !important; }
    .btn-fullscreen i { color: #ff0066; }

    .controls-row { padding: 0 12px 12px 12px; }
    #search { 
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); 
      color: white; padding: 10px 15px; border-radius: 12px; font-size: 13px; margin-bottom: 10px;
    }
    
    .tabs { display: flex; gap: 5px; }
    .tab-btn { 
      flex: 1; padding: 8px 0; background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); 
      color: #888; border-radius: 10px; font-size: 10px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: #fff; color: #000; border-color: #fff; }

    /* কনটেন্ট এরিয়া */
    #content-area { margin-top: 400px; transition: margin-top 0.3s; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; padding: 15px; }
    
    .channel-card { 
      background: var(--card-bg); border-radius: 18px; padding: 15px 8px; text-align: center; 
      border: 1px solid var(--card-border); position: relative; backdrop-filter: blur(10px); transition: 0.3s;
    }
    
    /* ফেভারিট স্টার পুনরায় যোগ করা হয়েছে */
    .fav-star { position: absolute; top: 8px; right: 8px; font-size: 15px; color: rgba(255,255,255,0.1); transition: 0.3s; z-index: 5; }
    .fav-star.active { color: var(--star); text-shadow: 0 0 8px var(--star); }
    
    .channel-logo { height: 40px; margin-bottom: 8px; object-fit: contain; }
    .channel-name { font-size: 10px; color: #ccc; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .footer-area { padding: 30px 0 100px 0; text-align: center; border-top: 1px solid var(--card-border); }
    .dev-name { font-weight: 800; color: #fff; text-shadow: 0 0 5px #ff4500; }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>

<div id="top-section">
  <div class="brand-header">
    <div class="brand-title-new"><i class="fa-solid fa-tv"></i> AVIA TV</div>
    <div id="online-status" style="font-size: 10px; color: #00ff88; font-weight: 800;">
      <i class="fa-solid fa-circle" style="font-size: 6px; animation: pulse 1.5s infinite;"></i> <span id="user-count">0</span> ONLINE
    </div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
  </div>

  <div id="ticker">
    <div class="ticker-content">
      <span id="now-playing-text" style="color: var(--primary); font-weight: 800;">চ্যানেল নির্বাচন করুন...</span>
      <span style="margin-left: 30px;">
        📢 পরামর্শ বা অভিযোগের জন্য টেলিগ্রাম গ্রুপে যুক্ত হোন: 
        <a href="https://t.me/techbd_group" target="_blank">TECH BD GROUP</a>
      </span>
    </div>
  </div>

  <div class="action-btns">
    <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank" class="rect-btn btn-get-app">
      <i class="fa-solid fa-download"></i> App
    </a>
    <a href="https://t.me/techbd_group" target="_blank" class="rect-btn btn-contact">
      <i class="fa-brands fa-telegram"></i> Join
    </a>
    <button onclick="window.location.reload()" class="rect-btn btn-refresh">
      <i class="fa-solid fa-rotate"></i> Reload
    </button>
    <button onclick="toggleRotateManual()" class="rect-btn btn-fullscreen">
      <i class="fa-solid fa-expand"></i> Full
    </button>
  </div>
  
  <div class="controls-row">
    <input type="text" id="search" placeholder="Search Channels...">
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">🔥 ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">⚽ SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">🇧🇩 BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </div>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  <div class="footer-area">
    <div style="font-size: 9px; color: #555; letter-spacing: 2px;">DEVELOPED BY <span class="dev-name">SOHEL TANVER</span></div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [];
let player;

function adjustMargin() {
  const h = document.getElementById('top-section').offsetHeight;
  document.getElementById('content-area').style.marginTop = (h + 10) + 'px';
}

function toggleRotateManual() {
  if (!player.isFullscreen()) {
    player.requestFullscreen();
  } else player.exitFullscreen();
}

document.getElementById("search").addEventListener("input", function() {
  const val = this.value.toLowerCase().trim();
  renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(val)));
});

function filterCat(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (cat === 'all') renderChannels(allChannels);
  else if (cat === 'fav') renderChannels(allChannels.filter(ch => favorites.includes(ch.id)));
  else renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(cat.toLowerCase())));
}

function toggleFav(event, id) {
  event.stopPropagation();
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  localStorage.setItem('myFavs', JSON.stringify(favorites));
  event.target.classList.toggle('active');
}

function playStream(url, name) {
  document.getElementById("now-playing-text").innerText = "দেখছেন: " + name;
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play().catch(() => {});
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function init() {
  player = videojs('v-player', { fluid: true });
  try {
    const res = await fetch(playlistUrl);
    const data = await res.text();
    allChannels = parseM3U(data);
    renderChannels(allChannels);
    if(allChannels.length > 0) playStream(allChannels[0].url, allChannels[0].name);
    setInterval(adjustMargin, 500);
  } catch(e) { console.error(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
      cur.id = btoa(unescape(encodeURIComponent(cur.name || "")));
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card" onclick="playStream('${ch.url}', '${ch.name}')">
      <i class="fa-solid fa-star fav-star ${favorites.includes(ch.id) ? 'active' : ''}" onclick="toggleFav(event, '${ch.id}')"></i>
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
}

init();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
  const firebaseConfig = { databaseURL: "https://avia-tv-default-rtdb.firebaseio.com/" };
  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const onlineRef = ref(db, 'online_users');
    const myRef = push(onlineRef);
    set(myRef, true);
    onDisconnect(myRef).remove();
    onValue(onlineRef, (s) => {
      document.getElementById("user-count").innerText = s.val() ? Object.keys(s.val()).length : 0;
    });
  } catch (e) {}
</script>
</body>
</html>
