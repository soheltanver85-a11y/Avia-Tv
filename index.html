<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; 
      --bg: #050505; 
      --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); 
      --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.8);
      --gold-gradient: linear-gradient(135deg, #ffdb00, #ffa500);
      --sidebar-width: 280px;
    }

    body { 
      margin: 0; padding: 0; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden; 
      min-height: 100vh;
    }

    /* Side Navigation */
    .sidenav {
      height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; left: 0;
      background-color: #111; overflow-x: hidden; transition: 0.5s;
      padding-top: 60px; border-right: 1px solid var(--card-border);
    }

    .sidenav a { padding: 12px 25px; text-decoration: none; font-size: 15px; color: #ccc; display: flex; align-items: center; gap: 15px; }
    .sidenav .closebtn { position: absolute; top: 15px; right: 25px; font-size: 30px; }
    .menu-overlay { display: none; position: fixed; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.7); z-index: 1999; }

    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; 
      background: var(--header-bg); backdrop-filter: blur(25px); z-index: 1000; 
      border-bottom: 1px solid var(--card-border); 
    }

    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { font-size: 19px; font-weight: 900; background: linear-gradient(to right, #fff, #a2f9ff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .online-counter-box { display: inline-flex; align-items: center; gap: 6px; color: var(--online); font-size: 11px; font-weight: 800; }
    .online-dot-blink { width: 6px; height: 6px; background-color: var(--online); border-radius: 50%; animation: pulse 1.5s infinite; }

    #ticker { padding: 10px 0; font-size: 13px; border-bottom: 1px solid var(--card-border); overflow: hidden; white-space: nowrap; }
    .ticker-content { display: inline-block; animation: marquee 35s linear infinite; }

    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .vjs-gesture-hint {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8); color: var(--primary); padding: 10px 20px;
        border-radius: 30px; display: none; z-index: 100;
    }

    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .rect-btn { height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; text-decoration: none; font-size: 9px; cursor: pointer; }

    .search-row { display: flex; gap: 8px; margin: 12px 0; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 10px; }

    .tabs { display: flex; gap: 6px; }
    .tab-btn { flex: 1; padding: 8px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; border-radius: 10px; font-size: 11px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #000; }

    #content-area { margin-top: 420px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 15px; }
    
    .channel-card { background: var(--card-bg); border-radius: 15px; padding: 15px 5px; text-align: center; border: 1px solid var(--card-border); transition: 0.3s; position: relative; }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
    .channel-logo { height: 45px; margin-bottom: 8px; object-fit: contain; max-width: 80%; }
    .channel-name { font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; }
    .fav-star { position: absolute; top: 8px; right: 8px; font-size: 12px; color: rgba(255,255,255,0.2); }
    .fav-star.active { color: var(--star); }

    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .spin { animation: fa-spin 1s infinite linear; }
  </style>
</head>
<body onload="init()">

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a href="https://t.me/techbd_group" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram Group</a>
  <a href="javascript:void(0)" onclick="shareApp()"><i class="fa-solid fa-share-nodes"></i> Share App</a>
</div>

<div id="menuOverlay" class="menu-overlay" onclick="closeNav()"></div>

<div id="top-section">
  <div class="brand-header">
    <div onclick="openNav()" style="cursor:pointer"><i class="fa-solid fa-bars-staggered"></i></div>
    <div class="brand-title-new">AVIA TV</div>
    <div class="online-counter-box">
      <div class="online-dot-blink"></div>
      <span>ONLINE: <span id="user-count">0</span></span>
    </div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
    <div id="gesture-hint" class="vjs-gesture-hint"></div>
  </div>

  <div id="ticker">
    <div class="ticker-content">
      <b>এখন দেখছেন:</b> <span id="now-playing-ticker" style="color:var(--primary)">চ্যানেল নির্বাচন করুন...</span> • 🚀 স্বাগতম Avia TV তে! বাফারিং মুক্ত স্ট্রিমিং উপভোগ করুন।
    </div>
  </div>

  <header>
    <div class="action-btns">
      <button onclick="manualRefresh()" class="rect-btn"><i id="refresh-icon" class="fa-solid fa-rotate-right"></i>&nbsp;Refresh</button>
      <a href="https://t.me/techbd_group" class="rect-btn"><i class="fa-brands fa-telegram"></i>&nbsp;Telegram</a>
      <a href="#" class="rect-btn"><i class="fa-solid fa-download"></i>&nbsp;APK</a>
      <button onclick="toggleRotateManual()" class="rect-btn" style="background:var(--primary);color:#000">FULL SCREEN</button>
    </div>
    
    <div class="search-row">
        <input type="text" id="search" placeholder="Search Channels..." oninput="handleSearch(this.value)">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
const basePlaylistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [];
let player, currentUrl = "";

async function init() {
  // উন্নত প্লেয়ার কনফিগারেশন
  player = videojs('v-player', {
    autoplay: true,
    controls: true,
    responsive: true,
    fluid: true,
    liveui: true,
    html5: {
      vhs: {
        overrideNative: true,
        enableLowInitialPlaylistLevel: true,
        fastQualityChange: true,
        handlePartialData: true // বাফার সমস্যার জন্য কার্যকর
      }
    }
  });

  // এরর রিকভারি লজিক (৬-৭ সেকেন্ডে বন্ধ হওয়া রোধ করবে)
  player.on('error', function() {
    console.log("Error detected, attempting to recover...");
    if (currentUrl) {
      setTimeout(() => {
        player.src({ src: currentUrl, type: 'application/x-mpegURL' });
        player.load();
        player.play().catch(() => {});
      }, 1000);
    }
  });

  // যদি ভিডিও স্টল হয়ে যায় (ডেটা আসা বন্ধ হয়)
  player.on('stalled', function() {
    player.load();
    player.play().catch(() => {});
  });

  setupMXControls(player);
  await fetchChannels();
  setInterval(adjustMargin, 500);
}

function playStream(url, name) {
  if(!url) return;
  currentUrl = url;
  document.getElementById("now-playing-ticker").innerText = name;
  
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.ready(() => {
    player.play().catch(e => {
        console.log("Auto-play blocked, muting to start...");
        player.muted(true);
        player.play();
    });
  });
  
  document.querySelectorAll('.channel-card').forEach(card => {
    card.classList.toggle('playing', card.getAttribute('data-url') === url);
  });
}

async function fetchChannels() {
    try {
        const res = await fetch(basePlaylistUrl + "?t=" + Date.now());
        const data = await res.text();
        allChannels = parseM3U(data);
        renderChannels(allChannels);
        if(currentUrl === "" && allChannels.length > 0) playStream(allChannels[0].url, allChannels[0].name);
    } catch(e) {
        document.getElementById("channelList").innerText = "চ্যানেল লোড করতে সমস্যা হচ্ছে।";
    }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
      cur.id = btoa(encodeURIComponent(cur.name || ""));
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); 
      if(cur.name) list.push({...cur}); 
      cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card ${currentUrl === ch.url ? 'playing' : ''}" data-url="${ch.url}" onclick="playStream('${ch.url}', '${ch.name}')">
      <i class="fa-solid fa-star fav-star ${favorites.includes(ch.id) ? 'active' : ''}" onclick="toggleFav(event, '${ch.id}')"></i>
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
}

function setupMXControls(player) {
    const wrapper = document.getElementById('player-wrapper');
    const hint = document.getElementById('gesture-hint');
    let startX, startY, startVol, brightness = 100;

    wrapper.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX; 
        startY = e.touches[0].clientY;
        startVol = player.volume();
    });

    wrapper.addEventListener('touchmove', (e) => {
        const deltaY = startY - e.touches[0].clientY;
        if (startX < (wrapper.clientWidth / 2)) {
            brightness = Math.min(200, Math.max(10, brightness + (deltaY / 5)));
            wrapper.style.filter = `brightness(${brightness}%)`;
            showHint(`Brightness: ${Math.round(brightness)}%`);
        } else {
            let newVol = Math.min(1, Math.max(0, startVol + (deltaY / 200)));
            player.volume(newVol);
            showHint(`Volume: ${Math.round(newVol * 100)}%`);
        }
    });

    wrapper.addEventListener('touchend', () => {
        setTimeout(() => hint.style.display = 'none', 1000);
    });
    function showHint(text) { hint.innerText = text; hint.style.display = 'block'; }
}

function handleSearch(val) {
    const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(val.toLowerCase()));
    renderChannels(filtered);
}

function filterCat(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (cat === 'all') renderChannels(allChannels);
  else if (cat === 'fav') renderChannels(allChannels.filter(ch => favorites.includes(ch.id)));
  else renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(cat.toLowerCase())));
}

function toggleFav(event, id) {
  event.stopPropagation();
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  localStorage.setItem('myFavs', JSON.stringify(favorites));
  event.target.classList.toggle('active');
}

function adjustMargin() {
  const h = document.getElementById('top-section').offsetHeight;
  document.getElementById('content-area').style.marginTop = (h + 10) + 'px';
}

function toggleRotateManual() {
  if (player.isFullscreen()) player.exitFullscreen();
  else player.requestFullscreen();
}

async function manualRefresh() {
    const icon = document.getElementById("refresh-icon");
    icon.classList.add("spin");
    await fetchChannels();
    setTimeout(() => icon.classList.remove("spin"), 1000);
}

function openNav() { document.getElementById("mySidenav").style.width = "var(--sidebar-width)"; document.getElementById("menuOverlay").style.display = "block"; }
function closeNav() { document.getElementById("mySidenav").style.width = "0"; document.getElementById("menuOverlay").style.display = "none"; }

function shareApp() {
    if (navigator.share) {
        navigator.share({ title: 'Avia TV', url: window.location.href });
    } else {
        alert('Link: ' + window.location.href);
    }
}
</script>

</body>
</html>
