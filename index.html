<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Avia TV - Premium Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; --bg: #050505; --card-bg: rgba(255, 255, 255, 0.03); 
      --card-border: rgba(255, 255, 255, 0.08); --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    body { 
      margin: 0; padding: 0; background: radial-gradient(circle at top center, #111b21 0%, var(--bg) 100%);
      color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; 
    }

    /* Fullscreen logic */
    .vjs-fullscreen #top-section { position: relative !important; }

    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.9); 
      backdrop-filter: blur(25px); z-index: 1000; border-bottom: 1px solid var(--card-border); 
    }
    
    .brand-header { padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { 
      font-size: 20px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(to right, var(--primary), #fff, var(--primary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 6px;
    }
    .brand-title-new i { font-size: 18px; color: var(--primary); filter: drop-shadow(0 0 5px var(--primary)); }

    #online-status { 
      font-size: 11px; color: var(--online); font-weight: 800; background: rgba(76, 175, 80, 0.1); 
      padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; border: 1px solid rgba(76, 175, 80, 0.2); 
    }
    .online-dot { width: 7px; height: 7px; background: var(--online); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .video-container { 
      position: relative; width: 100%; aspect-ratio: 16/9; max-width: 1000px; margin: 0 auto; 
      background: #000; box-shadow: 0 10px 40px rgba(0, 229, 255, 0.1);
    }
    .video-js { width: 100% !important; height: 100% !important; }
    
    #ticker { background: rgba(255,255,255,0.02); padding: 5px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 25s linear infinite; white-space: nowrap; color: #bbb; }

    header { padding: 12px; }

    /* বাটন সিরিয়াল পরিবর্তন ও ডিজাইন */
    .action-btns { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 6px; 
      margin-bottom: 12px; 
    }
    .nav-btn {
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 4px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255, 255, 255, 0.03); text-decoration: none; cursor: pointer; transition: 0.2s;
    }
    .nav-btn i { font-size: 11px; }
    .nav-btn span { font-size: 9px; font-weight: 600; color: #ffffff; }

    .btn-apk { border-color: rgba(61, 220, 132, 0.2); color: #3DDC84; }
    .btn-tg { border-color: rgba(36, 161, 222, 0.2); color: #24A1DE; }
    .btn-refresh { border-color: rgba(255, 165, 0, 0.2); color: #ffa500; }
    .btn-fs { border-color: rgba(0, 229, 255, 0.2); color: #00e5ff; }

    .nav-btn:active { transform: scale(0.96); opacity: 0.8; }

    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: white; padding: 10px 15px; border-radius: 12px; font-size: 13px; }
    #count { font-size: 10px; color: var(--primary); font-weight: 800; background: rgba(0, 229, 255, 0.1); padding: 5px 10px; border-radius: 8px; }

    .tabs { display: flex; gap: 5px; width: 100%; }
    .tab-btn { 
      flex: 1; padding: 7px 2px; background: var(--card-bg); border: 1px solid var(--card-border); 
      color: #888; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    #content-area { margin-top: 380px; transition: margin-top 0.3s; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; padding: 15px; }
    .channel-card { 
      background: var(--card-bg); border-radius: 18px; padding: 15px 8px; text-align: center; 
      border: 1px solid var(--card-border); transition: 0.4s; position: relative;
    }
    .channel-logo { height: 40px; margin-bottom: 8px; object-fit: contain; }
    .channel-name { font-size: 10px; color: #ccc; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ফুটারের ডিজাইন */
    .footer-area { padding: 30px 0 100px 0; text-align: center; border-top: 1px solid var(--card-border); margin-top: 20px; }
    .dev-credits { font-size: 8px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .dev-name { font-weight: 900; color: #ffffff; }

    .gesture-indicator { 
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.8); 
      color: var(--primary); padding: 10px 15px; border-radius: 30px; font-size: 14px; 
      z-index: 2147483647; display: none; border: 1px solid var(--primary); pointer-events: none;
    }
    #vol-indicator { right: 15px; } #bri-indicator { left: 15px; }
    #brightness-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; opacity: 0; pointer-events: none; z-index: 2147483646; }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body>

<div id="top-section">
  <div class="brand-header">
    <div class="brand-title-new"><i class="fa-solid fa-tv"></i> AVIA TV</div>
    <div id="online-status"><div class="online-dot"></div> <span id="user-count">0</span></div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline webkit-playsinline></video>
    <div id="brightness-overlay"></div>
    <div id="vol-indicator" class="gesture-indicator">🔊 100%</div>
    <div id="bri-indicator" class="gesture-indicator">☀️ 100%</div>
  </div>

  <div id="ticker">
    <div class="ticker-content">
      <span id="now-playing-text" style="color: var(--primary); font-weight: 900;">চ্যানেল নির্বাচন করুন...</span>
      <span style="margin-left: 30px;">📢 পরামর্শ বা অভিযোগের জন্য টেলিগ্রাম গ্রুপে যুক্ত হোন!</span>
    </div>
  </div>

  <header id="main-header">
    <div class="action-btns">
      <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank" class="nav-btn btn-apk">
        <i class="fa-solid fa-download"></i>
        <span>Get App</span>
      </a>
      <a href="https://t.me/techbd_group" target="_blank" class="nav-btn btn-tg">
        <i class="fa-brands fa-telegram"></i>
        <span>Contact</span>
      </a>
      <div onclick="window.location.reload()" class="nav-btn btn-refresh">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Refresh</span>
      </div>
      <div onclick="toggleFull()" class="nav-btn btn-fs">
        <i class="fa-solid fa-expand"></i>
        <span>Fullscreen</span>
      </div>
    </div>
    
    <div class="search-row">
      <input type="text" id="search" placeholder="Search Channels...">
      <span id="count">0 CH</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">🔥 ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">⚽ SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">🇧🇩 BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  <div class="footer-area">
    <div class="dev-credits">Developed by <span class="dev-name">Sohel Tanver</span></div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [];
let player;

function adjustMargin() {
  const h = document.getElementById('top-section').offsetHeight;
  document.getElementById('content-area').style.marginTop = (h + 10) + 'px';
}

// পাওয়ারফুল ফুলস্ক্রিন ফাংশন
function toggleFull() {
  const container = document.getElementById('player-wrapper');
  if (!document.fullscreenElement) {
    if (container.requestFullscreen) container.requestFullscreen();
    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
    
    // অটো রোটেট ল্যান্ডস্কেপ করার রিকোয়েস্ট
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(()=>{});
    }
  } else {
    document.exitFullscreen();
  }
}

async function init() {
  player = videojs('v-player', { 
    fluid: true,
    userActions: { click: true },
    controlBar: {
      children: ['playToggle', 'volumePanel', 'currentTimeDisplay', 'timeDivider', 'durationDisplay', 'progressControl', 'fullscreenToggle']
    }
  });
  
  // জেসচার কন্ট্রোল (ব্রাইটনেস ও ভলিউম)
  let startY, startVal, isBrightness;
  const wrapper = player.el();
  const briOverlay = document.getElementById('brightness-overlay');
  const volInd = document.getElementById('vol-indicator');
  const briInd = document.getElementById('bri-indicator');

  wrapper.addEventListener('touchstart', (e) => {
    startY = e.touches[0].pageY;
    isBrightness = (e.touches[0].pageX - wrapper.getBoundingClientRect().left) < wrapper.offsetWidth / 2;
    startVal = isBrightness ? (1 - parseFloat(briOverlay.style.opacity || 0)) : player.volume();
  });

  wrapper.addEventListener('touchmove', (e) => {
    if (e.cancelable) e.preventDefault();
    const diff = (startY - e.touches[0].pageY) / 150;
    let newVal = Math.min(Math.max(startVal + diff, 0), 1);
    
    if (isBrightness) {
      briOverlay.style.opacity = 1 - newVal;
      briInd.innerText = `☀️ ${Math.round(newVal * 100)}%`;
      briInd.style.display = 'block';
    } else {
      player.volume(newVal);
      volInd.innerText = `🔊 ${Math.round(newVal * 100)}%`;
      volInd.style.display = 'block';
    }
  }, { passive: false });

  wrapper.addEventListener('touchend', () => {
    setTimeout(() => { volInd.style.display = 'none'; briInd.style.display = 'none'; }, 800);
  });

  try {
    const res = await fetch(playlistUrl);
    const data = await res.text();
    allChannels = parseM3U(data);
    renderChannels(allChannels);
    if(allChannels.length > 0) {
        player.src({ src: allChannels[0].url, type: 'application/x-mpegURL' });
        document.getElementById("now-playing-text").innerText = "দেখছেন: " + allChannels[0].name;
    }
    setInterval(adjustMargin, 500);
  } catch(e) { console.error(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "";
      cur.id = btoa(unescape(encodeURIComponent(cur.name || "")));
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card" onclick="playStream('${ch.url}', '${ch.name}')">
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
  document.getElementById("count").textContent = list.length + " CH";
}

function playStream(url, name) {
  document.getElementById("now-playing-text").innerText = "দেখছেন: " + name;
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play().catch(() => {});
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
  const firebaseConfig = { databaseURL: "https://avia-tv-default-rtdb.firebaseio.com/" };
  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const onlineRef = ref(db, 'online_users');
    const myRef = push(onlineRef);
    set(myRef, true);
    onDisconnect(myRef).remove();
    onValue(onlineRef, (s) => {
      const count = s.val() ? Object.keys(s.val()).length : 0;
      document.getElementById("user-count").innerText = count;
    });
  } catch (e) {}
</script>
</body>
</html>
