<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; 
      --bg: #050505; 
      --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); 
      --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.8);
      --gold-gradient: linear-gradient(135deg, #ffdb00, #ffa500);
    }

    body.light-mode {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --header-bg: rgba(240, 242, 245, 0.9);
      --card-border: rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; padding: 0; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden; 
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; 
      background: var(--header-bg); 
      backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px);
      z-index: 1000; 
      border-bottom: 1px solid var(--card-border); 
    }

    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-logo-container { display: flex; align-items: center; gap: 8px; }
    .modern-tv-logo {
      width: 30px; height: 26px;
      background: #111; border: 2px solid #333; border-radius: 6px;
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .modern-tv-logo::before {
      content: ''; width: 6px; height: 6px; background: var(--gold-gradient); border-radius: 50%;
    }

    .brand-title-new { 
      font-size: 19px; font-weight: 900; letter-spacing: 1px; 
      background: linear-gradient(to right, #fff, #a2f9ff, #fff); 
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    }
    
    .online-counter-box {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(76, 175, 80, 0.1);
      color: var(--online); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800;
    }

    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; max-width: 1000px; margin: 0 auto; background: #000; }
    .video-js { width: 100% !important; height: 100% !important; }
    
    #ticker { background: rgba(255,255,255,0.02); padding: 6px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 30s linear infinite; white-space: nowrap; color: var(--text); }

    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .rect-btn { 
      height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; 
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); 
      cursor: pointer; text-decoration: none; gap: 6px; font-size: 9px; font-weight: 600;
    }

    .spin { animation: fa-spin 1s linear infinite; }

    .search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px 15px; border-radius: 12px; font-size: 13px; }

    .tabs { display: flex; gap: 6px; }
    .tab-btn { 
      flex: 1; padding: 8px 5px; background: var(--card-bg); border: 1px solid var(--card-border); 
      color: var(--text); opacity: 0.7; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: #000; opacity: 1; }

    #content-area { margin-top: 390px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 15px; }
    
    .channel-card { 
      background: var(--card-bg); border-radius: 18px; padding: 15px 8px; text-align: center; border: 1px solid var(--card-border); 
      transition: 0.3s; position: relative;
    }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }

    .fav-star { 
      position: absolute; top: 8px; right: 8px; font-size: 16px; 
      color: rgba(128,128,128,0.4); cursor: pointer; z-index: 10;
      transition: 0.3s; padding: 5px;
    }
    .fav-star.active { color: var(--star); text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
    
    .channel-logo { height: 45px; margin-bottom: 8px; object-fit: contain; pointer-events: none; }
    .channel-name { font-size: 10px; color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    @keyframes fa-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body onload="init()">

<div id="top-section">
  <div class="brand-header">
    <div class="brand-logo-container">
        <div class="modern-tv-logo"></div>
        <div class="brand-title-new">AVIA TV</div>
    </div>
    <div class="online-counter-box">
        <span>ONLINE: <span id="user-count">0</span></span>
    </div>
  </div>

  <div class="video-container">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
  </div>

  <div id="ticker">
    <div class="ticker-content">🚀 <b>Avia TV</b> তে স্বাগতম | 📡 বাফারিং ছাড়াই লাইভ স্ট্রিম উপভোগ করুন | 📢 গ্রুপ: TECH BD GROUP</div>
  </div>

  <header>
    <div class="action-btns">
      <button onclick="manualRefresh()" class="rect-btn">
        <i id="refresh-icon" class="fa-solid fa-rotate-right" style="color:var(--refresh)"></i><span>Refresh</span>
      </button>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn"><span>Group</span></a>
      <a href="#" class="rect-btn"><span>APK</span></a>
      <button onclick="toggleFullscreen()" class="rect-btn"><span>Full</span></button>
    </div>
    
    <div class="search-row">
        <input type="text" id="search" placeholder="Search Channels..." oninput="handleSearch(this.value)">
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
const basePlaylistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('aviaFavs')) || [];
let player, currentUrl = "", currentFilter = 'all';

async function manualRefresh() {
    const icon = document.getElementById("refresh-icon");
    icon.classList.add("spin");
    await fetchChannels();
    setTimeout(() => icon.classList.remove("spin"), 1000);
}

async function fetchChannels() {
    try {
        const res = await fetch(basePlaylistUrl + "?t=" + new Date().getTime(), { cache: "no-store" });
        const data = await res.text();
        allChannels = parseM3U(data);
        applyCurrentFilter();
    } catch(e) { console.error(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "";
      // নাম থেকে একটি ইউনিক আইডি তৈরি করা হচ্ছে
      cur.id = btoa(unescape(encodeURIComponent(cur.name || ""))).substring(0, 15);
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); 
      if(cur.name) list.push({...cur}); 
      cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card ${currentUrl === ch.url ? 'playing' : ''}" onclick="playStream('${ch.url}', '${ch.name}')">
      <i class="fa-solid fa-star fav-star ${favorites.includes(ch.id) ? 'active' : ''}" 
         onclick="toggleFav(event, '${ch.id}')"></i>
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
}

function toggleFav(event, id) {
    event.stopPropagation(); // কার্ড ক্লিকের মাধ্যমে ভিডিও প্লে হওয়া বন্ধ করবে
    if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
        event.target.classList.remove('active');
    } else {
        favorites.push(id);
        event.target.classList.add('active');
    }
    localStorage.setItem('aviaFavs', JSON.stringify(favorites));
    
    // যদি বর্তমানে 'fav' ট্যাবে থাকে, তবে লিস্ট আপডেট করবে
    if (currentFilter === 'fav') applyCurrentFilter();
}

function filterCat(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyCurrentFilter();
}

function applyCurrentFilter() {
    let list = allChannels;
    if (currentFilter === 'fav') {
        list = allChannels.filter(ch => favorites.includes(ch.id));
    } else if (currentFilter !== 'all') {
        list = allChannels.filter(ch => ch.name.toLowerCase().includes(currentFilter.toLowerCase()));
    }
    renderChannels(list);
}

function handleSearch(val) {
    const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(val.toLowerCase()));
    renderChannels(filtered);
}

function playStream(url, name) {
    currentUrl = url;
    player.src({ src: url, type: 'application/x-mpegURL' });
    player.play();
    renderChannels(allChannels); // সিলেকশন হাইলাইট করার জন্য
}

function toggleFullscreen() {
    if (!player.isFullscreen()) player.requestFullscreen();
    else player.exitFullscreen();
}

async function init() {
    player = videojs('v-player', { fluid: true });
    await fetchChannels();
    setInterval(fetchChannels, 30000); // ৩০ সেকেন্ড অটো আপডেট
    
    // হাইট অ্যাডজাস্টমেন্ট
    setInterval(() => {
        const h = document.getElementById('top-section').offsetHeight;
        document.getElementById('content-area').style.marginTop = (h + 10) + 'px';
    }, 500);
}
</script>

</body>
</html>
