<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Premium Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; --bg: #050505; --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.8); --gold-gradient: linear-gradient(135deg, #ffdb00, #ffa500);
      --sidebar-bg: #121212;
    }
    body.light-mode {
      --bg: #f0f2f5; --card-bg: #ffffff; --text: #1a1a1a;
      --header-bg: rgba(240, 242, 245, 0.9); --card-border: rgba(0, 0, 0, 0.1); --sidebar-bg: #ffffff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; transition: background 0.3s ease; }

    /* Sidebar */
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--sidebar-bg); z-index: 2000; transition: 0.4s; box-shadow: 5px 0 15px rgba(0,0,0,0.5); padding: 20px; overflow-y: auto; }
    .sidebar.active { left: 0; }
    .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1999; display: none; }
    .sidebar-overlay.active { display: block; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid var(--card-border); padding-bottom: 15px; }
    .sidebar-menu-item { display: flex; align-items: center; gap: 15px; padding: 12px; color: var(--text); text-decoration: none; font-size: 14px; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; cursor: pointer; }
    .sidebar-menu-item:hover { background: var(--card-bg); color: var(--primary); }
    .sidebar-label { font-size: 11px; color: #888; text-transform: uppercase; margin: 15px 0 10px 10px; letter-spacing: 1px; }

    /* UI Components */
    #top-section { position: fixed; top: 0; left: 0; width: 100%; background: var(--header-bg); backdrop-filter: blur(25px); z-index: 1000; border-bottom: 1px solid var(--card-border); }
    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .video-js { width: 100% !important; height: 100% !important; }
    
    #ticker { background: rgba(255,255,255,0.02); padding: 6px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 30s linear infinite; white-space: nowrap; color: var(--text); }
    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .rect-btn { height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); cursor: pointer; font-size: 9px; font-weight: 600; text-transform: uppercase; }
    
    .search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px; border-radius: 12px; }
    
    .tabs { display: flex; gap: 6px; }
    .tab-btn { flex: 1; padding: 8px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #000; }

    #content-area { margin-top: 390px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 15px; }
    .channel-card { background: var(--card-bg); border-radius: 18px; padding: 15px 8px; text-align: center; border: 1px solid var(--card-border); transition: 0.3s; position: relative; }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
    .channel-logo { height: 45px; margin-bottom: 8px; object-fit: contain; }
    .channel-name { font-size: 10px; color: var(--text); font-weight: 600; }
  </style>
</head>
<body onload="init()">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:25px; height:22px; background:#111; border:2px solid #333; border-radius:6px;"></div>
      <b style="color:var(--primary)">AVIA TV</b>
    </div>
    <i class="fa-solid fa-xmark" onclick="toggleSidebar()"></i>
  </div>

  <div class="sidebar-label">Exclusive</div>
  <div class="sidebar-menu-item" onclick="filterFanCode()">
    <i class="fa-solid fa-bolt" style="color:var(--accent)"></i>
    <span>FanCode Live</span>
    <span style="background:red; color:white; font-size:8px; padding:2px 5px; border-radius:4px; margin-left:auto;">LIVE</span>
  </div>

  <div class="sidebar-label">Settings</div>
  <div class="sidebar-menu-item" onclick="toggleTheme()">
    <i class="fa-solid fa-moon"></i>
    <span>Dark/Light Mode</span>
  </div>

  <div class="sidebar-label">Communicate</div>
  <a href="https://t.me/techbd_group" target="_blank" class="sidebar-menu-item">
    <i class="fa-brands fa-telegram" style="color:var(--tg)"></i>
    <span>Telegram Group</span>
  </a>
  <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank" class="sidebar-menu-item">
    <i class="fa-solid fa-cloud-arrow-down" style="color:var(--apk)"></i>
    <span>Update App</span>
  </a>
  <div class="sidebar-menu-item" onclick="shareApp()">
    <i class="fa-solid fa-share-nodes"></i>
    <span>Share App</span>
  </div>

  <div class="sidebar-menu-item" onclick="exitApp()" style="margin-top:20px; border-top:1px solid var(--card-border); padding-top:20px;">
    <i class="fa-solid fa-right-from-bracket" style="color:var(--primary)"></i>
    <span>Exit</span>
  </div>
</div>
<div id="top-section">
  <div class="brand-header">
    <div class="left-side" style="display:flex; align-items:center; gap:12px;">
      <i class="fa-solid fa-bars" onclick="toggleSidebar()" style="cursor:pointer"></i>
      <b style="font-size:18px;">AVIA TV</b>
    </div>
    <div class="online-counter-box" style="color:var(--online); font-size:11px;">
      ONLINE: <span id="user-count">0</span>
    </div>
  </div>

  <div class="video-container">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
  </div>

  <div id="ticker">
    <div class="ticker-content" id="ticker-text">🚀 Avia TV তে আপনাকে স্বাগতম | 📡 বাফারিং ছাড়াই সব চ্যানেল উপভোগ করুন | 📢 টেলিগ্রাম গ্রুপ: TECH BD GROUP</div>
  </div>

  <header>
    <div class="action-btns">
      <div class="rect-btn" onclick="window.location.reload()"><i class="fa-solid fa-rotate-right"></i> REFRESH</div>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn" style="text-decoration:none;"><i class="fa-brands fa-telegram"></i> GROUP</a>
      <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank" class="rect-btn" style="text-decoration:none;"><i class="fa-solid fa-download"></i> APK</a>
      <div class="rect-btn" onclick="toggleFull()"><i class="fa-solid fa-expand"></i> FULL</div>
    </div>
    <div class="search-row">
      <input type="text" id="search" placeholder="Search Channels..." oninput="handleSearch(this.value)">
      <span id="count" style="font-size:11px; font-weight:800; color:var(--primary);">0 CH</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  <div style="text-align:center; padding:20px; font-size:9px; color:#888;">Developed by Sohel Tanver</div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [];
let player, currentUrl = "";

// ১. FanCode ফিল্টার ফাংশন (উন্নত সংস্করণ)
function filterFanCode() {
  const fanCodeList = allChannels.filter(ch => 
    ch.name.toLowerCase().includes('fancode') || 
    ch.name.toLowerCase().includes('fan code')
  );
  
  if (fanCodeList.length > 0) {
    renderChannels(fanCodeList);
    playStream(fanCodeList[0].url, fanCodeList[0].name, true);
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  } else {
    alert("FanCode চ্যানেল খুঁজে পাওয়া যায়নি!");
  }
  toggleSidebar();
}

// ২. Exit ফাংশন
function exitApp() {
  if (confirm("আপনি কি নিশ্চিতভাবে বের হতে চান?")) {
    window.close();
    setTimeout(() => { window.location.href = "about:blank"; }, 100);
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}

function playStream(url, name, shouldScroll = false) {
  currentUrl = url;
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play().catch(() => {});
  renderChannels(allChannels); // Refresh UI for highlight
}

async function init() {
  player = videojs('v-player', { fluid: true });
  try {
    const res = await fetch(playlistUrl);
    const data = await res.text();
    allChannels = parseM3U(data);
    renderChannels(allChannels);
    if(allChannels.length > 0) playStream(allChannels[0].url, allChannels[0].name);
    setInterval(() => {
      const h = document.getElementById('top-section').offsetHeight;
      document.getElementById('content-area').style.marginTop = (h + 5) + 'px';
    }, 500);
  } catch(e) {}
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "";
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card ${currentUrl === ch.url ? 'playing' : ''}" onclick="playStream('${ch.url}', '${ch.name}')">
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
  document.getElementById("count").textContent = list.length + " CH";
}

function handleSearch(val) {
  const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(val.toLowerCase()));
  renderChannels(filtered);
}

function filterCat(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (cat === 'all') renderChannels(allChannels);
  else renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(cat.toLowerCase())));
}

function toggleTheme() { document.body.classList.toggle('light-mode'); }
function toggleFull() { if (!player.isFullscreen()) player.requestFullscreen(); else player.exitFullscreen(); }
function shareApp() { if (navigator.share) navigator.share({ title: 'Avia TV', url: window.location.href }); }
</script>
</body>
</html>
