<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; 
      --bg: #050505; 
      --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); 
      --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.8);
      --gold-gradient: linear-gradient(135deg, #ffdb00, #ffa500);
      --sidebar-width: 280px;
    }

    body.light-mode {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --header-bg: rgba(240, 242, 245, 0.9);
      --card-border: rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; padding: 0; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden; 
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    /* --- Side Navigation --- */
    .sidenav {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 2000;
      top: 0;
      left: 0;
      background-color: #111;
      overflow-x: hidden;
      transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      padding-top: 60px;
      box-shadow: 5px 0 15px rgba(0,0,0,0.5);
      border-right: 1px solid var(--card-border);
    }

    .sidenav .closebtn {
      position: absolute;
      top: 15px;
      right: 25px;
      font-size: 30px;
      color: #818181;
      text-decoration: none;
    }

    .menu-section-label {
        padding: 20px 25px 10px;
        font-size: 11px;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 900;
    }

    .sidenav a, .menu-item-div {
      padding: 12px 25px;
      text-decoration: none;
      font-size: 15px;
      color: #ccc;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: 0.3s;
    }

    .sidenav a:hover { color: var(--primary); background: rgba(255,255,255,0.05); }

    .sidenav .live-badge {
        background: #ff4081;
        color: white;
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: bold;
        margin-left: auto;
        animation: pulse-animation 1.5s infinite;
    }

    .menu-overlay {
      display: none;
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1999;
      backdrop-filter: blur(3px);
    }

    .menu-trigger {
        font-size: 22px;
        cursor: pointer;
        color: var(--text);
        display: flex;
        align-items: center;
        padding: 5px;
    }

    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; 
      background: var(--header-bg); 
      backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px);
      z-index: 1000; 
      border-bottom: 1px solid var(--card-border); 
    }

    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    
    .brand-logo-container { display: flex; align-items: center; gap: 12px; }

    .brand-title-new { 
      font-size: 19px; font-weight: 900; letter-spacing: 1px; 
      background: linear-gradient(to right, #fff, #a2f9ff, #fff); 
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    }
    
    .header-right-side { display: flex; align-items: center; gap: 12px; }

    .online-counter-box {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(76, 175, 80, 0.1);
      color: var(--online); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .online-dot-blink { width: 6px; height: 6px; background-color: var(--online); border-radius: 50%; animation: pulse-animation 1.5s infinite; }
    @keyframes pulse-animation { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; max-width: 1000px; margin: 0 auto; background: #000; box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5); touch-action: none; overflow: hidden; }
    .video-js { width: 100% !important; height: 100% !important; }
    
    .vjs-gesture-hint {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8); color: var(--primary); padding: 12px 25px;
        border-radius: 30px; font-size: 14px; font-weight: bold; z-index: 100;
        display: none; pointer-events: none; border: 1px solid var(--primary);
        backdrop-filter: blur(5px);
    }

    #ticker { background: rgba(255,255,255,0.02); padding: 6px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 30s linear infinite; white-space: nowrap; color: var(--text); opacity: 0.8; }
    
    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .rect-btn { 
      height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; 
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); 
      cursor: pointer; text-decoration: none; gap: 6px; transition: 0.3s;
    }
    .rect-btn:active { transform: scale(0.95); }
    .rect-btn span { font-size: 9px; font-weight: 600; text-transform: uppercase; }
    .btn-rotate { background: var(--primary); border: none; }
    .btn-rotate i, .btn-rotate span { color: #000; font-weight: 800; }

    .spin { animation: fa-spin 1s linear infinite; }

    .search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; width: 100%; }
    
    #search { 
      flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); 
      color: var(--text); padding: 10px 15px; border-radius: 12px; font-size: 13px; 
    }

    #count { 
      font-size: 11px; color: var(--primary); font-weight: 800; 
      background: rgba(0, 229, 255, 0.1); padding: 8px 12px; border-radius: 10px; 
      border: 1px solid rgba(0, 229, 255, 0.2); height: 38px; display: flex; align-items: center;
    }

    .tabs { display: flex; gap: 6px; width: 100%; }
    .tab-btn { 
      flex: 1; padding: 8px 5px; background: var(--card-bg); 
      border: 1px solid var(--card-border); color: var(--text); opacity: 0.7; border-radius: 10px; 
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: #000; opacity: 1; }

    #content-area { margin-top: 400px; transition: margin-top 0.3s; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 15px; }
    
    .channel-card { 
      background: var(--card-bg); border-radius: 18px; padding: 15px 8px; text-align: center; border: 1px solid var(--card-border); transition: 0.3s;
    }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
    .channel-logo { height: 45px; margin-bottom: 8px; object-fit: contain; }
    .channel-name { font-size: 10px; color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .footer-area { padding: 30px 0 100px 0; text-align: center; border-top: 1px solid var(--card-border); }
    .dev-credits { font-size: 9px; color: #888; text-transform: uppercase; }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body onload="init()">

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <div class="menu-section-label">Communicate</div>
  <a href="https://t.me/techbd_group" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram</a>
  <a href="javascript:void(0)" onclick="shareApp()"><i class="fa-solid fa-share-nodes"></i> Share</a>
  <a href="javascript:void(0)" onclick="window.location.reload()"><i class="fa-solid fa-rotate"></i> Reload Player</a>
</div>

<div id="menuOverlay" class="menu-overlay" onclick="closeNav()"></div>

<div id="top-section">
  <div class="brand-header">
    <div class="brand-logo-container">
        <div class="menu-trigger" onclick="openNav()"><i class="fa-solid fa-bars-staggered"></i></div>
        <div class="brand-title-new">AVIA TV</div>
    </div>
    <div class="header-right-side">
      <div class="online-counter-box">
        <div class="online-dot-blink"></div>
        <span>ONLINE: <span id="user-count">0</span></span>
      </div>
    </div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
    <div id="gesture-hint" class="vjs-gesture-hint"></div>
  </div>

  <div id="ticker">
    <div class="ticker-content">
      <b>দেখছেন:</b> <span id="now-playing-ticker">চ্যানেল নির্বাচন করুন...</span> | 🚀 Avia TV তে স্বাগতম | 📡 বাফারিং ছাড়াই লাইভ স্ট্রিম উপভোগ করুন
    </div>
  </div>

  <header id="main-header">
    <div class="action-btns">
      <button onclick="manualRefresh()" class="rect-btn"><i id="refresh-icon" class="fa-solid fa-rotate-right"></i><span>Refresh</span></button>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn"><i class="fa-brands fa-telegram"></i><span>Group</span></a>
      <a href="#" class="rect-btn"><i class="fa-solid fa-download"></i><span>APK</span></a>
      <button onclick="toggleFullscreen()" class="rect-btn btn-rotate"><i class="fa-solid fa-expand"></i><span>Full</span></button>
    </div>
    
    <div class="search-row">
        <input type="text" id="search" placeholder="Search Channels..." oninput="handleSearch(this.value)">
        <span id="count">0 CH</span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">BANGLA</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  <div class="footer-area">
    <div class="dev-credits">Developed by <span style="color:var(--primary); font-weight:900">Sohel Tanver</span></div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
const basePlaylistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], player, currentUrl = "";

// Sidebar Control
function openNav() { document.getElementById("mySidenav").style.width = "var(--sidebar-width)"; document.getElementById("menuOverlay").style.display = "block"; }
function closeNav() { document.getElementById("mySidenav").style.width = "0"; document.getElementById("menuOverlay").style.display = "none"; }

// Player Initialization with Error Recovery
async function init() {
  player = videojs('v-player', {
    fluid: true,
    autoplay: true,
    controls: true,
    preload: 'auto',
    html5: {
      vhs: { overrideNative: true },
      nativeVideoTracks: false,
      nativeAudioTracks: false
    }
  });

  // সমাধান: স্ট্রিম ৩-৪ সেকেন্ড পর বন্ধ হলে অটো রিকভারি
  player.on('error', function() {
    console.log("Error detected, recovering...");
    setTimeout(() => {
        player.src({ src: currentUrl, type: 'application/x-mpegURL' });
        player.load();
        player.play();
    }, 1000);
  });

  setupMXControls(player);
  await fetchChannels();
  setInterval(adjustMargin, 500);
}

async function fetchChannels() {
    try {
        const res = await fetch(basePlaylistUrl + "?t=" + Date.now());
        const data = await res.text();
        allChannels = parseM3U(data);
        renderChannels(allChannels);
        if(currentUrl === "" && allChannels.length > 0) {
            playStream(allChannels[0].url, allChannels[0].name);
        }
    } catch(e) { console.error(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(channels) {
  const container = document.getElementById("channelList");
  container.innerHTML = channels.map(ch => `
    <div class="channel-card ${ch.url === currentUrl ? 'playing' : ''}" onclick="playStream('${ch.url}', '${ch.name}')" data-url="${ch.url}">
      <img class="channel-logo" src="${ch.logo}" alt="logo">
      <div class="channel-name">${ch.name}</div>
    </div>
  `).join('');
  document.getElementById("count").innerText = channels.length + " CH";
}

function playStream(url, name) {
  currentUrl = url;
  document.getElementById("now-playing-ticker").innerText = name;
  
  // সোর্স পরিবর্তনের সময় পজ করে লোড করা
  player.pause();
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.load();
  player.play().catch(e => console.log("Autoplay blocked or error"));

  document.querySelectorAll('.channel-card').forEach(card => {
    card.classList.toggle('playing', card.getAttribute('data-url') === url);
  });
}

function handleSearch(val) {
    const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(val.toLowerCase()));
    renderChannels(filtered);
}

function toggleFullscreen() {
    if (player.isFullscreen()) player.exitFullscreen();
    else player.requestFullscreen();
}

function adjustMargin() {
  const h = document.getElementById('top-section').offsetHeight;
  document.getElementById('content-area').style.marginTop = (h + 10) + 'px';
}

function setupMXControls(player) {
    const wrapper = document.getElementById('player-wrapper');
    const hint = document.getElementById('gesture-hint');
    let startX, startY, startVol, isMoving = false;

    wrapper.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        startVol = player.volume(); isMoving = false;
    });

    wrapper.addEventListener('touchmove', (e) => {
        isMoving = true;
        const deltaY = startY - e.touches[0].clientY;
        const isLeft = startX < (wrapper.clientWidth / 2);
        if (!isLeft) {
            let newVol = Math.min(1, Math.max(0, startVol + (deltaY / 200)));
            player.volume(newVol);
            hint.innerText = `Volume: ${Math.round(newVol * 100)}%`;
            hint.style.display = 'block';
        }
    });

    wrapper.addEventListener('touchend', () => {
        setTimeout(() => hint.style.display = 'none', 600);
    });
}
</script>

</body>
</html>
