<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Premium</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; 
      --bg: #050505; 
      --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); 
      --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.9);
      --gold-gradient: linear-gradient(135deg, #ffdb00, #ffa500);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      margin: 0; padding: 0; background: var(--bg); color: var(--text); 
      font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh;
    }

    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; 
      background: var(--header-bg); backdrop-filter: blur(20px); 
      z-index: 1000; border-bottom: 1px solid var(--card-border); 
    }

    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title { font-size: 19px; font-weight: 900; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .online-box { color: var(--online); font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 5px; }

    .video-container { width: 100%; aspect-ratio: 16/9; background: #000; }
    .video-js { width: 100% !important; height: 100% !important; }
    
    /* চলন্ত লেখা ও লিংক */
    #ticker { background: rgba(255,255,255,0.02); padding: 7px 0; font-size: 11px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 25s linear infinite; white-space: nowrap; }
    .ticker-content a { color: var(--primary); text-decoration: none; font-weight: 800; border-bottom: 1px dashed var(--primary); }

    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .rect-btn { 
      height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; 
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); 
      cursor: pointer; text-decoration: none; font-size: 10px; font-weight: 600;
    }
    .spin { animation: fa-spin 1s linear infinite; }

    /* কালারফুল ক্যাটাগরি বাটন */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { 
      padding: 10px 20px; border-radius: 12px; font-size: 11px; font-weight: 800; 
      cursor: pointer; border: none; color: #fff; opacity: 0.6; transition: 0.3s; flex-shrink: 0;
    }
    .tab-btn.active { opacity: 1; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

    .btn-all { background: linear-gradient(45deg, #444, #666); }
    .btn-sports { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
    .btn-bangla { background: linear-gradient(45deg, #1d976c, #93f9b9); color: #000 !important; }
    .btn-fav { background: linear-gradient(45deg, #f7971e, #ffd200); color: #000 !important; }

    #content-area { margin-top: 400px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 15px; }
    
    .channel-card { 
      background: var(--card-bg); border-radius: 15px; padding: 15px 10px; text-align: center; 
      border: 1px solid var(--card-border); transition: 0.3s; position: relative;
    }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }

    /* ফেভারিট স্টার */
    .fav-star { 
      position: absolute; top: 6px; right: 6px; font-size: 18px; 
      color: rgba(255,255,255,0.2); cursor: pointer; z-index: 10; padding: 5px;
    }
    .fav-star.active { color: var(--star); }
    
    .channel-logo { height: 48px; margin-bottom: 8px; object-fit: contain; }
    .channel-name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    @keyframes fa-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body onload="init()">

<div id="top-section">
  <div class="brand-header">
    <div class="brand-title">AVIA TV</div>
    <div class="online-box">
        <i class="fa-solid fa-circle" style="font-size: 8px;"></i>
        <span>ONLINE: <span id="user-count">0</span></span>
    </div>
  </div>

  <div class="video-container">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
  </div>

  <div id="ticker">
    <div class="ticker-content">
      🚀 <b>Avia TV</b> তে স্বাগতম | 📡 বাফারিং ছাড়াই লাইভ স্ট্রিম উপভোগ করুন | 📢 জয়েন করুন: 
      <a href="https://t.me/techbd_group" target="_blank">TECH BD GROUP (TELEGRAM)</a>
    </div>
  </div>

  <header>
    <div class="action-btns">
      <button onclick="manualRefresh()" class="rect-btn">
        <i id="refresh-icon" class="fa-solid fa-rotate-right" style="color:var(--refresh)"></i>&nbsp;Refresh
      </button>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn">Group</a>
      <a href="#" class="rect-btn">APK</a>
      <button onclick="toggleFull()" class="rect-btn">Full Screen</button>
    </div>
    
    <div class="tabs">
      <button class="tab-btn btn-all active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn btn-sports" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn btn-bangla" onclick="filterCat('bangla', this)">BANGLA</button>
      <button class="tab-btn btn-fav" onclick="filterCat('fav', this)">⭐ FAVORITE</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
const basePlaylistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('aviaFavs')) || [];
let player, currentUrl = "", currentFilter = 'all';

async function manualRefresh() {
    const icon = document.getElementById("refresh-icon");
    icon.classList.add("spin");
    await fetchChannels();
    setTimeout(() => icon.classList.remove("spin"), 1000);
}

async function fetchChannels() {
    try {
        const res = await fetch(basePlaylistUrl + "?t=" + new Date().getTime(), { cache: "no-store" });
        const data = await res.text();
        allChannels = parseM3U(data);
        applyCurrentFilter();
    } catch(e) { console.error(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "";
      cur.id = btoa(unescape(encodeURIComponent(cur.name || ""))).substring(0, 15);
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); 
      if(cur.name) list.push({...cur}); 
      cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card ${currentUrl === ch.url ? 'playing' : ''}" onclick="playStream('${ch.url}', '${ch.name}')">
      <i class="fa-solid fa-star fav-star ${favorites.includes(ch.id) ? 'active' : ''}" 
         onclick="toggleFav(event, '${ch.id}')"></i>
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
}

function toggleFav(event, id) {
    event.stopPropagation();
    if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
    } else {
        favorites.push(id);
    }
    localStorage.setItem('aviaFavs', JSON.stringify(favorites));
    applyCurrentFilter();
}

function filterCat(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyCurrentFilter();
}

function applyCurrentFilter() {
    let list = allChannels;
    if (currentFilter === 'fav') {
        list = allChannels.filter(ch => favorites.includes(ch.id));
    } else if (currentFilter !== 'all') {
        list = allChannels.filter(ch => ch.name.toLowerCase().includes(currentFilter.toLowerCase()));
    }
    renderChannels(list);
}

function playStream(url, name) {
    currentUrl = url;
    player.src({ src: url, type: 'application/x-mpegURL' });
    player.play();
    applyCurrentFilter();
}

function toggleFull() {
    if (!player.isFullscreen()) player.requestFullscreen();
    else player.exitFullscreen();
}

async function init() {
    player = videojs('v-player', { fluid: true });
    await fetchChannels();
    setInterval(fetchChannels, 30000); // ৩০ সেকেন্ড অটো আপডেট
    
    setInterval(() => {
        const h = document.getElementById('top-section').offsetHeight;
        document.getElementById('content-area').style.marginTop = (h + 10) + 'px';
    }, 500);
}
</script>

</body>
</html>
