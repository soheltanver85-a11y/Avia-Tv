<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avia TV - Premium Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; --bg: #050505; --card-bg: rgba(255, 255, 255, 0.03); 
      --card-border: rgba(255, 255, 255, 0.08); --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { margin: 0; padding: 0; background: radial-gradient(circle at top center, #111b21 0%, var(--bg) 100%); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }

    #top-section { position: fixed; top: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(25px); z-index: 1000; border-bottom: 1px solid var(--card-border); }
    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { font-size: 18px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(to right, var(--primary), #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 6px; }
    
    .online-counter-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(76, 175, 80, 0.1);
      color: var(--online);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .online-dot-blink { width: 6px; height: 6px; background-color: var(--online); border-radius: 50%; animation: pulse-animation 1.5s infinite; }
    @keyframes pulse-animation { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ভিডিও প্লেয়ার এবং জেসচার স্টাইল */
    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; max-width: 1000px; margin: 0 auto; background: #000; box-shadow: 0 5px 20px rgba(0, 229, 255, 0.1); touch-action: none; overflow: hidden; }
    .video-js { width: 100% !important; height: 100% !important; }
    
    /* MX Player Style Hint */
    .vjs-gesture-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.7);
        color: var(--primary);
        padding: 12px 25px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: bold;
        z-index: 100;
        display: none;
        pointer-events: none;
        border: 1px solid var(--primary);
    }

    #ticker { background: rgba(255,255,255,0.02); padding: 5px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 30s linear infinite; white-space: nowrap; color: #ccc; }
    .ticker-content b { color: var(--primary); }

    header { padding: 10px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
    .rect-btn { height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border); color: #fff; cursor: pointer; text-decoration: none; gap: 4px; }
    .rect-btn i { font-size: 11px; }
    .rect-btn span { font-size: 8px; font-weight: 500; text-transform: uppercase; opacity: 0.8; }
    .btn-rotate { background: var(--primary); border: none; }
    .btn-rotate i, .btn-rotate span { color: #000; font-weight: 800; }

    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; width: calc(100% - 60px); }
    #count { font-size: 9px; color: var(--primary); font-weight: 800; background: rgba(0, 229, 255, 0.1); padding: 8px; border-radius: 6px; float: right; }

    .tabs { display: flex; gap: 4px; width: 100%; clear: both; }
    .tab-btn { flex: 1; padding: 6px 2px; background: var(--card-bg); border: 1px solid var(--card-border); color: #888; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    #content-area { margin-top: 380px; transition: margin-top 0.3s; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; padding: 12px; }
    
    .channel-card { background: var(--card-bg); border-radius: 15px; padding: 12px 5px; text-align: center; border: 1px solid var(--card-border); transition: 0.3s; position: relative; scroll-margin-top: 400px; }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.12); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); transform: scale(1.02); }
    .channel-card.playing .channel-name { color: var(--primary); font-weight: 800; }

    .fav-star { position: absolute; top: 5px; right: 5px; font-size: 10px; color: rgba(255,255,255,0.1); }
    .fav-star.active { color: var(--star); text-shadow: 0 0 5px var(--star); }
    .channel-logo { height: 35px; margin-bottom: 6px; object-fit: contain; }
    .channel-name { font-size: 9px; color: #ccc; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .footer-area { padding: 20px 0 80px 0; text-align: center; border-top: 1px solid var(--card-border); margin-top: 20px; }
    .dev-credits { font-size: 8px; color: #666; letter-spacing: 1px; text-transform: uppercase; }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body>

<div id="top-section">
  <div class="brand-header">
    <div class="brand-title-new"><i class="fa-solid fa-tv"></i> AVIA TV</div>
    <div class="online-counter-box">
      <div class="online-dot-blink"></div>
      <span>ONLINE: <span id="user-count">0</span></span>
    </div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
    <div id="gesture-hint" class="vjs-gesture-hint"></div>
  </div>

  <div id="ticker">
    <div class="ticker-content" id="ticker-text">
      <b>দেখছেন:</b> <span id="now-playing-ticker">চ্যানেল নির্বাচন করুন...</span> | 
      🚀 <b>Avia TV</b> তে আপনাকে স্বাগতম | 📡 বাফারিং ছাড়াই সব চ্যানেল উপভোগ করুন | 
      📢 সমস্যা হলে টেলিগ্রাম গ্রুপ: <b>TECH BD GROUP</b>
    </div>
  </div>

  <header id="main-header">
    <div class="action-btns">
      <button onclick="window.location.reload()" class="rect-btn"><i class="fa-solid fa-rotate-right" style="color:var(--refresh)"></i><span>Refresh</span></button>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn"><i class="fa-brands fa-telegram" style="color:var(--tg)"></i><span>Group</span></a>
      <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank" class="rect-btn"><i class="fa-solid fa-download" style="color:var(--apk)"></i><span>APK</span></a>
      <button onclick="toggleRotateManual()" class="rect-btn btn-rotate"><i class="fa-solid fa-expand"></i><span>Full</span></button>
    </div>
    <span id="count">0 CH</span>
    <input type="text" id="search" placeholder="Search Channels...">
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  <div class="footer-area">
    <div class="dev-credits">Developed by <span style="color:white; font-weight:900">Sohel Tanver</span></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://avia-tv-default-rtdb.firebaseio.com/" };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const onlineRef = ref(db, 'online_users'); 
    const myRef = push(onlineRef);
    set(myRef, true);
    onDisconnect(myRef).remove();
    onValue(onlineRef, (snapshot) => {
      const count = snapshot.val() ? Object.keys(snapshot.val()).length : 0;
      document.getElementById("user-count").innerText = count;
    });
  } catch (error) { console.error("Firebase Error:", error); }
</script>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
// কনফিগ
const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [];
let player, currentUrl = "";

// ১. MX Player Gesture Controls
function setupGestures(player) {
    const wrapper = document.getElementById('player-wrapper');
    const hint = document.getElementById('gesture-hint');
    let startX, startY, startVol, startBright;
    let brightness = 100;

    wrapper.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startVol = player.volume();
        startBright = brightness;
    });

    wrapper.addEventListener('touchmove', (e) => {
        const deltaY = startY - e.touches[0].clientY;
        const isLeft = startX < (wrapper.clientWidth / 2);

        if (isLeft) {
            // Brightness (Left Side)
            brightness = Math.min(200, Math.max(10, startBright + (deltaY / 2)));
            wrapper.style.filter = `brightness(${brightness}%)`;
            showHint(`Brightness: ${Math.round(brightness)}%`);
        } else {
            // Volume (Right Side)
            let newVol = Math.min(1, Math.max(0, startVol + (deltaY / 200)));
            player.volume(newVol);
            showHint(`Volume: ${Math.round(newVol * 100)}%`);
        }
        e.preventDefault();
    }, { passive: false });

    wrapper.addEventListener('touchend', () => {
        setTimeout(() => hint.style.display = 'none', 600);
    });

    // Play/Pause on Center Click
    wrapper.addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON' && !e.target.closest('.vjs-control-bar')) {
            if (player.paused()) player.play(); else player.pause();
        }
    });

    function showHint(text) {
        hint.innerText = text;
        hint.style.display = 'block';
    }
}

function adjustMargin() {
  const h = document.getElementById('top-section').offsetHeight;
  document.getElementById('content-area').style.marginTop = (h + 5) + 'px';
}

function playStream(url, name, shouldScroll = false) {
  currentUrl = url;
  document.getElementById("now-playing-ticker").innerText = name;
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play().catch(() => {});
  
  document.querySelectorAll('.channel-card').forEach(card => {
    card.classList.remove('playing');
    if (card.getAttribute('data-url') === url) {
      card.classList.add('playing');
      if (shouldScroll) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });
}

async function init() {
  player = videojs('v-player', { 
    fluid: true,
    userActions: { doubleClick: true }
  });

  // জেসচার চালু করা
  setupGestures(player);

  try {
    const res = await fetch(playlistUrl);
    const data = await res.text();
    allChannels = parseM3U(data);
    renderChannels(allChannels);
    if(allChannels.length > 0) playStream(allChannels[0].url, allChannels[0].name, false);
    setInterval(adjustMargin, 500);
  } catch(e) { console.error(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
      cur.id = btoa(unescape(encodeURIComponent(cur.name || "")));
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card ${currentUrl === ch.url ? 'playing' : ''}" data-url="${ch.url}" onclick="playStream('${ch.url}', '${ch.name}', true)">
      <i class="fa-solid fa-star fav-star ${favorites.includes(ch.id) ? 'active' : ''}" onclick="toggleFav(event, '${ch.id}')"></i>
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
  document.getElementById("count").textContent = list.length + " CH";
}

function filterCat(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (cat === 'all') renderChannels(allChannels);
  else if (cat === 'fav') renderChannels(allChannels.filter(ch => favorites.includes(ch.id)));
  else renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(cat.toLowerCase())));
}

function toggleFav(event, id) {
  event.stopPropagation();
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  localStorage.setItem('myFavs', JSON.stringify(favorites));
  event.target.classList.toggle('active');
}

async function toggleRotateManual() {
  if (!player.isFullscreen()) player.requestFullscreen();
  else player.exitFullscreen();
}

document.getElementById("search").addEventListener("input", function() {
  renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(this.value.toLowerCase())));
});

init();
</script>
</body>
</html>
