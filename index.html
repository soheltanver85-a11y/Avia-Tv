<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; 
      --bg: #050505; 
      --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); 
      --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.85);
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; padding: 0; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden; 
      min-height: 100vh;
    }

    /* Side Navigation */
    .sidenav {
      height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; left: 0;
      background-color: #111; overflow-x: hidden; transition: 0.5s;
      padding-top: 60px; border-right: 1px solid var(--card-border);
    }
    .sidenav a { padding: 12px 25px; text-decoration: none; font-size: 15px; color: #ccc; display: flex; align-items: center; gap: 15px; }
    .menu-overlay { display: none; position: fixed; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.7); z-index: 1999; backdrop-filter: blur(3px); }

    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; 
      background: var(--header-bg); backdrop-filter: blur(25px); z-index: 1000; 
      border-bottom: 1px solid var(--card-border); 
    }

    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { font-size: 19px; font-weight: 900; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .online-counter-box { display: inline-flex; align-items: center; gap: 6px; background: rgba(76, 175, 80, 0.1); color: var(--online); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }

    /* Unique Ticker */
    #ticker { background: rgba(255,255,255,0.02); padding: 8px 0; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; white-space: nowrap; animation: marquee 35s linear infinite; font-size: 13px; }
    .tg-link-inline { background: rgba(36, 161, 222, 0.2); color: #24A1DE!important; padding: 2px 10px; border-radius: 50px; text-decoration: none; font-weight: 900; }

    /* Video Player */
    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .video-js { width: 100%!important; height: 100%!important; }

    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .rect-btn { height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); cursor: pointer; text-decoration: none; gap: 5px; font-size: 10px; font-weight: 600; }

    /* Modern Colorful Tabs */
    .tabs { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { 
        padding: 10px 20px; border-radius: 15px; border: 1px solid var(--card-border); 
        background: var(--card-bg); color: #fff; font-weight: 700; font-size: 12px; 
        cursor: pointer; transition: 0.4s; min-width: 90px; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    
    /* Individual Tab Colors */
    .tab-all.active { background: linear-gradient(45deg, #00c6ff, #0072ff); border-color: #00c6ff; box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3); }
    .tab-sports.active { background: linear-gradient(45deg, #f093fb, #f5576c); border-color: #f5576c; box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3); }
    .tab-bangla.active { background: linear-gradient(45deg, #43e97b, #38f9d7); border-color: #43e97b; box-shadow: 0 4px 15px rgba(67, 233, 123, 0.3); color: #000; }
    .tab-fav.active { background: linear-gradient(45deg, #f6d365, #fda085); border-color: #f6d365; box-shadow: 0 4px 15px rgba(246, 211, 101, 0.3); color: #000; }

    #content-area { margin-top: 430px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 15px; padding: 15px; }
    
    .channel-card { background: var(--card-bg); border-radius: 20px; padding: 15px 10px; text-align: center; border: 1px solid var(--card-border); transition: 0.3s; position: relative; }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); transform: scale(1.05); }
    .fav-star { position: absolute; top: 10px; right: 10px; font-size: 14px; color: rgba(255,255,255,0.2); }
    .fav-star.active { color: var(--star); }
    .channel-logo { height: 50px; margin-bottom: 8px; border-radius: 10px; }
    .channel-name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .spin { animation: fa-spin 1s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body onload="init()">

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" onclick="closeNav()"><i class="fa-solid fa-xmark"></i> Close</a>
  <a href="https://t.me/techbd_group" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram</a>
</div>
<div id="menuOverlay" class="menu-overlay" onclick="closeNav()"></div>

<div id="top-section">
  <div class="brand-header">
    <div onclick="openNav()" style="cursor:pointer; font-size:20px;"><i class="fa-solid fa-bars-staggered"></i></div>
    <div class="brand-title-new">AVIA TV</div>
    <div class="online-counter-box">
      <div style="width:6px; height:6px; background:var(--online); border-radius:50%;"></div>
      <span>ONLINE: <span id="user-count">0</span></span>
    </div>
  </div>

  <div class="video-container">
    <video id="v-player" class="video-js vjs-big-play-centered" controls playsinline></video>
  </div>

  <div id="ticker">
    <div class="ticker-content">
      <b>দেখছেন:</b> <span id="now-playing-ticker" style="color:var(--accent)">চ্যানেল নির্বাচন করুন...</span> 
      <span style="margin:0 40px">•</span> 🚀 বাফারিং ছাড়াই লাইভ স্ট্রিম উপভোগ করুন 
      <span style="margin:0 40px">•</span> যুক্ত হন: <a href="https://t.me/techbd_group" target="_blank" class="tg-link-inline">TECH BD</a>
    </div>
  </div>

  <header>
    <div class="action-btns">
      <button onclick="manualRefresh()" class="rect-btn"><i id="refresh-icon" class="fa-solid fa-rotate-right" style="color:var(--refresh)"></i><span>Refresh</span></button>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn"><i class="fa-brands fa-telegram" style="color:var(--tg)"></i><span>Group</span></a>
      <a href="#" class="rect-btn"><i class="fa-solid fa-download" style="color:var(--apk)"></i><span>APK</span></a>
      <button onclick="player.requestFullscreen()" class="rect-btn"><i class="fa-solid fa-expand"></i><span>Full</span></button>
    </div>
    
    <div class="tabs">
      <button class="tab-btn tab-all active" onclick="filterCat('all', this)"><i class="fa-solid fa-layer-group"></i> ALL</button>
      <button class="tab-btn tab-sports" onclick="filterCat('sports', this)"><i class="fa-solid fa-trophy"></i> SPORTS</button>
      <button class="tab-btn tab-bangla" onclick="filterCat('bangla', this)"><i class="fa-solid fa-language"></i> BANGLA</button>
      <button class="tab-btn tab-fav" onclick="filterCat('fav', this)"><i class="fa-solid fa-star"></i> FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  <div style="text-align:center; padding:30px 0 100px; font-size:10px; color:#555;">Developed by SOHEL TANVER</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
  const firebaseConfig = { databaseURL: "https://avia-tv-default-rtdb.firebaseio.com/" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const onlineRef = ref(db, 'online_users'); 
  const myRef = push(onlineRef);
  set(myRef, true);
  onDisconnect(myRef).remove();
  onValue(onlineRef, (s) => { document.getElementById("user-count").innerText = s.val() ? Object.keys(s.val()).length : 0; });
</script>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [], player;

async function init() {
  player = videojs('v-player', { autoplay: true, controls: true, fluid: true, liveui: true });
  await fetchChannels();
  setInterval(() => {
    const h = document.getElementById('top-section').offsetHeight;
    document.getElementById('content-area').style.marginTop = (h + 10) + 'px';
  }, 500);
}

async function fetchChannels() {
    try {
        const res = await fetch(playlistUrl + "?cache=" + Date.now());
        const data = await res.text();
        allChannels = parseM3U(data);
        renderChannels(allChannels);
        if(allChannels.length > 0) playStream(allChannels[0].url, allChannels[0].name);
    } catch(e) { console.log(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
      cur.id = btoa(unescape(encodeURIComponent(cur.name)));
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card" onclick="playStream('${ch.url}', '${ch.name}')">
      <i class="fa-solid fa-star fav-star ${favorites.includes(ch.id) ? 'active' : ''}" onclick="toggleFav(event, '${ch.id}')"></i>
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
}

function playStream(url, name) {
  document.getElementById("now-playing-ticker").innerText = name;
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play().catch(e => {});
}

async function manualRefresh() {
    const icon = document.getElementById("refresh-icon");
    icon.classList.add("spin");
    await fetchChannels();
    setTimeout(() => icon.classList.remove("spin"), 1000);
}

function filterCat(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (cat === 'all') renderChannels(allChannels);
  else if (cat === 'fav') renderChannels(allChannels.filter(ch => favorites.includes(ch.id)));
  else renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(cat.toLowerCase())));
}

function toggleFav(e, id) {
  e.stopPropagation();
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  localStorage.setItem('myFavs', JSON.stringify(favorites));
  e.target.classList.toggle('active');
}

function openNav() { document.getElementById("mySidenav").style.width = "280px"; document.getElementById("menuOverlay").style.display = "block"; }
function closeNav() { document.getElementById("mySidenav").style.width = "0"; document.getElementById("menuOverlay").style.display = "none"; }
</script>

</body>
</html>
