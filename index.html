<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avia TV - Premium Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; --bg: #050505; --card-bg: rgba(255, 255, 255, 0.03); 
      --card-border: rgba(255, 255, 255, 0.08); --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }

    #top-section { position: fixed; top: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid var(--card-border); }
    .brand-header { padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { font-size: 20px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 6px; }

    #online-status { font-size: 11px; color: var(--online); font-weight: 800; background: rgba(76, 175, 80, 0.1); padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
    .online-dot { width: 7px; height: 7px; background: var(--online); border-radius: 50%; animation: pulse 1.5s infinite; }

    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .video-js { width: 100% !important; height: 100% !important; }
    
    #ticker { background: rgba(255,255,255,0.02); padding: 5px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 25s linear infinite; white-space: nowrap; color: #bbb; }

    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .nav-btn { display: flex; align-items: center; justify-content: center; gap: 4px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255, 255, 255, 0.03); cursor: pointer; color: #fff; }
    .nav-btn span { font-size: 9px; font-weight: 600; }
    .btn-fs { color: #00e5ff; border-color: rgba(0, 229, 255, 0.2); }

    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: white; padding: 10px; border-radius: 10px; font-size: 12px; }
    .tabs { display: flex; gap: 5px; }
    .tab-btn { flex: 1; padding: 8px; background: var(--card-bg); border: 1px solid var(--card-border); color: #888; border-radius: 8px; font-size: 10px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #000; }

    #content-area { margin-top: 380px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; padding: 15px; }
    .channel-card { background: var(--card-bg); border-radius: 15px; padding: 10px; text-align: center; border: 1px solid var(--card-border); }
    .channel-logo { height: 35px; object-fit: contain; margin-bottom: 5px; }
    .channel-name { font-size: 10px; color: #ccc; }

    .footer-area { padding: 20px 0 80px 0; text-align: center; border-top: 1px solid var(--card-border); }
    .dev-credits { font-size: 9px; color: #888; text-transform: uppercase; }
    .dev-name { font-weight: 800; color: #fff; }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>

<div id="top-section">
  <div class="brand-header">
    <div class="brand-title-new"><i class="fa-solid fa-tv"></i> AVIA TV</div>
    <div id="online-status"><div class="online-dot"></div> <span id="user-count">0</span></div>
  </div>

  <div class="video-container">
    <video id="v-player" class="video-js vjs-big-play-centered" controls playsinline webkit-playsinline></video>
  </div>

  <div id="ticker">
    <div class="ticker-content">নিচে থেকে আপনার পছন্দের চ্যানেলটি নির্বাচন করুন এবং সরাসরি লাইভ টিভি উপভোগ করুন।</div>
  </div>

  <header>
    <div class="action-btns">
      <div onclick="goFullScreen()" class="nav-btn btn-fs">
        <i class="fa-solid fa-expand"></i>
        <span>Fullscreen</span>
      </div>
      <div onclick="window.location.reload()" class="nav-btn">
        <i class="fa-solid fa-rotate"></i>
        <span>Refresh</span>
      </div>
      <a href="https://t.me/techbd_group" target="_blank" class="nav-btn" style="text-decoration: none;">
        <i class="fa-brands fa-telegram"></i>
        <span>Telegram</span>
      </a>
      <a href="#" class="nav-btn" style="text-decoration: none;">
        <i class="fa-solid fa-download"></i>
        <span>App</span>
      </a>
    </div>
    
    <div class="search-row">
      <input type="text" id="search" placeholder="চ্যানেল খুঁজুন...">
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">BANGLA</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  <div class="footer-area">
    <div class="dev-credits">Developed by <span class="dev-name">Sohel Tanver</span></div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
  let player = videojs('v-player', { fluid: true });
  const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
  let allChannels = [];

  // সরাসরি ফুলস্ক্রিন করার জন্য এই ফাংশনটি সবচেয়ে কার্যকর
  function goFullScreen() {
    if (player.requestFullscreen) {
      player.requestFullscreen();
    } else if (player.el().webkitRequestFullscreen) {
      player.el().webkitRequestFullscreen();
    }
    // অনেক ফোনে ফুলস্ক্রিন দিলে অটোমেটিক ল্যান্ডস্কেপ হওয়ার রিকোয়েস্ট
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(e => console.log("Orientation lock not supported"));
    }
  }

  async function fetchChannels() {
    const res = await fetch(playlistUrl);
    const data = await res.text();
    allChannels = parseM3U(data);
    renderChannels(allChannels);
    if(allChannels.length > 0) player.src({ src: allChannels[0].url, type: 'application/x-mpegURL' });
  }

  function parseM3U(data) {
    const lines = data.split("\n"), list = [];
    let cur = {};
    lines.forEach(l => {
      if (l.startsWith("#EXTINF")) {
        cur.name = l.split(",")[1]?.trim();
        cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "";
      } else if (l.startsWith("http")) {
        cur.url = l.trim();
        if(cur.name) list.push({...cur});
        cur = {};
      }
    });
    return list;
  }

  function renderChannels(list) {
    const grid = document.getElementById("channelList");
    grid.innerHTML = list.map(ch => `
      <div class="channel-card" onclick="player.src({src: '${ch.url}', type: 'application/x-mpegURL'}); player.play(); window.scrollTo(0,0);">
        <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
        <div class="channel-name">${ch.name}</div>
      </div>`).join('');
  }

  function filterCat(cat, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if(cat === 'all') renderChannels(allChannels);
    else renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(cat)));
  }

  fetchChannels();
  setInterval(() => {
    document.getElementById('content-area').style.marginTop = document.getElementById('top-section').offsetHeight + 'px';
  }, 500);
</script>
</body>
</html>
