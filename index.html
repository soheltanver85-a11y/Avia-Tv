<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avia TV - Premium Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; --bg: #050505; --card-bg: rgba(255, 255, 255, 0.03); 
      --card-border: rgba(255, 255, 255, 0.08); --accent: #ff4081; --online: #4CAF50; --text: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }

    #top-section { position: fixed; top: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 1px solid var(--card-border); }
    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { font-size: 18px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 6px; }

    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .video-js { width: 100% !important; height: 100% !important; }

    header { padding: 10px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
    .nav-btn { display: flex; align-items: center; justify-content: center; height: 32px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255, 255, 255, 0.03); cursor: pointer; color: #fff; text-decoration: none; }
    .nav-btn span { font-size: 9px; font-weight: 600; margin-left: 4px; }
    .btn-fs { color: #00e5ff; border-color: rgba(0, 229, 255, 0.2); }

    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: white; padding: 10px; border-radius: 8px; font-size: 12px; }

    #content-area { margin-top: 350px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; padding: 15px; }
    .channel-card { background: var(--card-bg); border-radius: 12px; padding: 10px; text-align: center; border: 1px solid var(--card-border); transition: 0.3s; }
    .channel-logo { height: 35px; object-fit: contain; margin-bottom: 5px; }
    .channel-name { font-size: 9px; color: #ccc; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ফুটারের লেখা আপনার ছবির মতো ছোট */
    .footer-area { padding: 20px 0 80px 0; text-align: center; }
    .dev-credits { font-size: 8px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .dev-name { font-weight: 800; color: #999; }
  </style>
</head>
<body>

<div id="top-section">
  <div class="brand-header">
    <div class="brand-title-new"><i class="fa-solid fa-tv"></i> AVIA TV</div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls playsinline webkit-playsinline></video>
  </div>

  <header>
    <div class="action-btns">
      <div onclick="forceFullscreen()" class="nav-btn btn-fs">
        <i class="fa-solid fa-expand"></i>
        <span>Fullscreen</span>
      </div>
      <div onclick="window.location.reload()" class="nav-btn">
        <i class="fa-solid fa-rotate"></i>
        <span>Refresh</span>
      </div>
      <a href="https://t.me/techbd_group" target="_blank" class="nav-btn">
        <i class="fa-brands fa-telegram"></i>
        <span>Contact</span>
      </a>
      <a href="#" class="nav-btn">
        <i class="fa-solid fa-download"></i>
        <span>App</span>
      </a>
    </div>
    
    <div class="search-row">
      <input type="text" id="search" placeholder="Search channels...">
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">Loading...</div>
  <div class="footer-area">
    <div class="dev-credits">Developed by <span class="dev-name">Sohel Tanver</span></div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
  let player = videojs('v-player', { fluid: true });
  const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";

  // পাওয়ারফুল ফুলস্ক্রিন ফাংশন
  async function forceFullscreen() {
    const el = document.getElementById('player-wrapper');
    
    try {
      if (el.requestFullscreen) {
        await el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) {
        await el.webkitRequestFullscreen();
      } else if (el.mozRequestFullScreen) {
        await el.mozRequestFullScreen();
      } else if (el.msRequestFullscreen) {
        await el.msRequestFullscreen();
      }

      // স্ক্রিন ঘোরানোর আসল ম্যাজিক এখানে
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
      }
    } catch (err) {
      // যদি ব্রাউজার অটো-রোটেট ব্লক করে, তবে বিকল্প হিসেবে ভিডিও জেএস এর নিজস্ব মোড ব্যবহার করবে
      player.requestFullscreen();
    }
  }

  async function fetchChannels() {
    try {
      const res = await fetch(playlistUrl);
      const data = await res.text();
      const channels = parseM3U(data);
      renderChannels(channels);
      if(channels.length > 0) player.src({ src: channels[0].url, type: 'application/x-mpegURL' });
    } catch (e) { console.error("Error loading channels"); }
  }

  function parseM3U(data) {
    const lines = data.split("\n"), list = [];
    let cur = {};
    lines.forEach(l => {
      if (l.startsWith("#EXTINF")) {
        cur.name = l.split(",")[1]?.trim();
        cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "";
      } else if (l.startsWith("http")) {
        cur.url = l.trim();
        if(cur.name) list.push({...cur});
        cur = {};
      }
    });
    return list;
  }

  function renderChannels(list) {
    const grid = document.getElementById("channelList");
    grid.innerHTML = list.map(ch => `
      <div class="channel-card" onclick="player.src({src: '${ch.url}', type: 'application/x-mpegURL'}); player.play(); window.scrollTo(0,0);">
        <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
        <div class="channel-name">${ch.name}</div>
      </div>`).join('');
  }

  fetchChannels();
  
  // মার্জিন অ্যাডজাস্ট করা
  setInterval(() => {
    const topH = document.getElementById('top-section').offsetHeight;
    document.getElementById('content-area').style.marginTop = (topH + 5) + 'px';
  }, 500);

  // সার্চ ফাংশন
  document.getElementById('search').oninput = function() {
    const query = this.value.toLowerCase();
    const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
    renderChannels(filtered);
  };
</script>
</body>
</html>
