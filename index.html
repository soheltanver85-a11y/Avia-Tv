<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avia TV - Fixed</title>

<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<style>
body {margin:0;background:#000;color:#fff;font-family:sans-serif;}
.video-container {width:100%;aspect-ratio:16/9;}
.video-js {width:100%!important;height:100%!important;}
#channelList {display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:10px;}
.card {background:#111;padding:10px;text-align:center;cursor:pointer;border-radius:10px;}
.card:hover {background:#222;}
</style>
</head>

<body onload="init()">

<div class="video-container">
<video id="v-player" class="video-js" controls autoplay muted></video>
</div>

<div id="channelList"></div>

<script>
const basePlaylistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";

let player, allChannels=[], currentUrl="";

// ---------- INIT ----------
async function init(){
player = videojs('v-player',{
autoplay:true,
muted:true,
controls:true,
fluid:true,
liveui:true,
html5:{
hls:{overrideNative:true}
}
});

// error auto retry
player.on('error', ()=>{
console.log("Error... retry");
setTimeout(()=>{
if(currentUrl){
player.src({src:currentUrl,type:'application/x-mpegURL'});
player.play().catch(()=>{});
}
},2000);
});

// autoplay fix
player.ready(()=>{
player.play().catch(()=>{});
});

await fetchChannels();

// auto refresh stream
setInterval(()=>{
if(currentUrl && !player.paused()){
player.src({src:currentUrl,type:'application/x-mpegURL'});
player.play().catch(()=>{});
}
},60000);
}

// ---------- FETCH ----------
async function fetchChannels(){
const res = await fetch(basePlaylistUrl + "?t=" + Date.now());
const data = await res.text();
allChannels = parseM3U(data);
renderChannels();
if(allChannels.length>0) playStream(allChannels[0].url);
}

// ---------- PARSE ----------
function parseM3U(data){
const lines=data.split("\n");
let list=[],cur={};
lines.forEach(l=>{
if(l.startsWith("#EXTINF")){
cur.name=l.split(",")[1];
}
else if(l.startsWith("http")){
cur.url=l.trim();
list.push({...cur});
cur={};
}
});
return list;
}

// ---------- RENDER ----------
function renderChannels(){
const el=document.getElementById("channelList");
el.innerHTML=allChannels.map(ch=>`
<div class="card" onclick="playStream('${ch.url}')">
${ch.name}
</div>
`).join("");
}

// ---------- PLAY ----------
function playStream(url){
currentUrl=url;

player.pause();
player.src({
src:url,
type:'application/x-mpegURL'
});
player.load();

player.play().catch(()=>{
setTimeout(()=>player.play().catch(()=>{}),1000);
});
}
</script>

</body>
</html>
