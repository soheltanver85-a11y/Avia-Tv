<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; 
      --bg: #050505; 
      --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); 
      --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.8);
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; padding: 0; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden; 
      min-height: 100vh;
    }

    /* Side Navigation */
    .sidenav {
      height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; left: 0;
      background-color: #111; overflow-x: hidden; transition: 0.5s; padding-top: 60px;
      box-shadow: 5px 0 15px rgba(0,0,0,0.5); border-right: 1px solid var(--card-border);
    }
    .sidenav a { padding: 12px 25px; text-decoration: none; font-size: 15px; color: #ccc; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
    .sidenav .closebtn { position: absolute; top: 15px; right: 25px; font-size: 30px; }

    #top-section { position: fixed; top: 0; left: 0; width: 100%; background: var(--header-bg); backdrop-filter: blur(25px); z-index: 1000; border-bottom: 1px solid var(--card-border); }
    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { font-size: 19px; font-weight: 900; background: linear-gradient(to right, #fff, #a2f9ff, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .online-counter-box { display: inline-flex; align-items: center; gap: 6px; color: var(--online); font-size: 11px; font-weight: 800; }
    .online-dot-blink { width: 6px; height: 6px; background-color: var(--online); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
    .video-js { width: 100% !important; height: 100% !important; }

    #ticker { background: rgba(255,255,255,0.02); padding: 6px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 30s linear infinite; white-space: nowrap; }
    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .rect-btn { height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); cursor: pointer; text-decoration: none; gap: 6px; font-size: 9px; font-weight: 600; text-transform: uppercase; }
    .spin { animation: fa-spin 1s linear infinite; }

    .search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px 15px; border-radius: 12px; }

    .tabs { display: flex; gap: 6px; }
    .tab-btn { flex: 1; padding: 8px 5px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #000; }

    #content-area { margin-top: 400px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 15px; }
    
    .channel-card { background: var(--card-bg); border-radius: 18px; padding: 15px 8px; text-align: center; border: 1px solid var(--card-border); position: relative; transition: 0.3s; }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
    .fav-star { position: absolute; top: 8px; right: 8px; font-size: 14px; color: rgba(128,128,128,0.5); cursor: pointer; z-index: 10; }
    .fav-star.active { color: var(--star); }
    .channel-logo { height: 45px; margin-bottom: 8px; object-fit: contain; pointer-events: none; }
    .channel-name { font-size: 10px; font-weight: 600; pointer-events: none; }

    .footer-area { padding: 30px 0 100px; text-align: center; border-top: 1px solid var(--card-border); }
    .vjs-gesture-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 20px; display: none; z-index: 100; }
  </style>
</head>
<body onload="init()">

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a href="https://t.me/techbd_group" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram</a>
  <a href="javascript:void(0)" onclick="shareApp()"><i class="fa-solid fa-share-nodes"></i> Share</a>
  <a href="javascript:void(0)" onclick="window.close()"><i class="fa-solid fa-right-from-bracket"></i> Exit</a>
</div>

<div id="top-section">
  <div class="brand-header">
    <div onclick="openNav()" style="cursor:pointer"><i class="fa-solid fa-bars-staggered"></i> <span class="brand-title-new">AVIA TV</span></div>
    <div class="online-counter-box"><div class="online-dot-blink"></div>ONLINE: <span id="user-count">0</span></div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
    <div id="gesture-hint" class="vjs-gesture-hint"></div>
  </div>

  <div id="ticker">
    <div class="ticker-content">🚀 <b>Avia TV</b> তে স্বাগতম | দেখছেন: <span id="now-playing-ticker">...</span> | বাফারিং ছাড়া লাইভ উপভোগ করুন!</div>
  </div>

  <header>
    <div class="action-btns">
      <button onclick="manualRefresh()" class="rect-btn"><i id="refresh-icon" class="fa-solid fa-rotate-right" style="color:var(--refresh)"></i><span>Refresh</span></button>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn"><i class="fa-brands fa-telegram" style="color:var(--tg)"></i><span>Group</span></a>
      <a href="#" class="rect-btn"><i class="fa-solid fa-download" style="color:var(--apk)"></i><span>APK</span></a>
      <button onclick="player.requestFullscreen()" class="rect-btn" style="background:var(--primary); color:#000"><i class="fa-solid fa-expand"></i><span>Full</span></button>
    </div>
    <div class="search-row">
      <input type="text" id="search" placeholder="Search Channels..." oninput="handleSearch(this.value)">
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  <div class="footer-area"><div class="dev-credits">Developed by <span style="color:var(--primary)">Sohel Tanver</span></div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
  const firebaseConfig = { databaseURL: "https://avia-tv-default-rtdb.firebaseio.com/" };
  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const onlineRef = ref(db, 'online_users'); 
    const myRef = push(onlineRef);
    set(myRef, true);
    onDisconnect(myRef).remove();
    onValue(onlineRef, (snapshot) => {
      document.getElementById("user-count").innerText = snapshot.val() ? Object.keys(snapshot.val()).length : 0;
    });
  } catch (e) {}
</script>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
const basePlaylistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [];
let player, currentUrl = "", currentCategory = 'all';

async function init() {
  player = videojs('v-player', { fluid: true, autoplay: true, html5: { vhs: { overrideNative: true } } });
  
  // ভিডিও বন্ধ হওয়া রোধ করতে অটো-রিট্রাই লজিক
  player.on('error', () => {
    setTimeout(() => { if(currentUrl) { player.src({ src: currentUrl, type: 'application/x-mpegURL' }); player.load(); player.play(); } }, 1000);
  });

  setupMXControls(player);
  await fetchChannels();
  setInterval(() => { const h = document.getElementById('top-section').offsetHeight; document.getElementById('content-area').style.marginTop = (h + 5) + 'px'; }, 500);
}

async function fetchChannels() {
  try {
    const res = await fetch(basePlaylistUrl + "?t=" + new Date().getTime());
    const data = await res.text();
    allChannels = parseM3U(data);
    renderChannels(allChannels);
    if(!currentUrl && allChannels.length > 0) playStream(allChannels[0].url, allChannels[0].name);
  } catch(e) { console.log("Fetch Error"); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const container = document.getElementById("channelList");
  let displayList = list;
  
  if(currentCategory === 'fav') {
    displayList = list.filter(c => favorites.includes(c.url));
  }

  container.innerHTML = displayList.map(ch => {
    const isFav = favorites.includes(ch.url);
    return `
      <div class="channel-card ${ch.url === currentUrl ? 'playing' : ''}" onclick="playStream('${ch.url}', '${ch.name}')">
        <i class="fa-solid fa-star fav-star ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${ch.url}')"></i>
        <img class="channel-logo" src="${ch.logo}">
        <div class="channel-name">${ch.name}</div>
      </div>
    `;
  }).join('');
}

function toggleFav(e, url) {
  e.stopPropagation();
  if(favorites.includes(url)) favorites = favorites.filter(f => f !== url);
  else favorites.push(url);
  localStorage.setItem('myFavs', JSON.stringify(favorites));
  renderChannels(allChannels);
}

function filterCat(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChannels(allChannels);
}

function playStream(url, name) {
  currentUrl = url;
  document.getElementById("now-playing-ticker").innerText = name;
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play();
  document.querySelectorAll('.channel-card').forEach(c => c.classList.toggle('playing', c.getAttribute('onclick').includes(url)));
}

async function manualRefresh() {
  const icon = document.getElementById("refresh-icon");
  icon.classList.add("spin");
  await fetchChannels();
  setTimeout(() => icon.classList.remove("spin"), 1000);
}

function handleSearch(val) {
  const filtered = allChannels.filter(c => c.name.toLowerCase().includes(val.toLowerCase()));
  renderChannels(filtered);
}

function openNav() { document.getElementById("mySidenav").style.width = "var(--sidebar-width)"; }
function closeNav() { document.getElementById("mySidenav").style.width = "0"; }

function setupMXControls(player) {
  const wrapper = document.getElementById('player-wrapper');
  const hint = document.getElementById('gesture-hint');
  let startX, startY, startVol, startBright, brightness = 100;
  wrapper.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; startVol = player.volume(); startBright = brightness; });
  wrapper.addEventListener('touchmove', (e) => {
    const deltaY = startY - e.touches[0].clientY;
    if (startX < (wrapper.clientWidth / 2)) {
      brightness = Math.min(200, Math.max(10, startBright + (deltaY / 2)));
      wrapper.style.filter = `brightness(${brightness}%)`;
      hint.innerText = `Brightness: ${Math.round(brightness)}%`;
    } else {
      let newVol = Math.min(1, Math.max(0, startVol + (deltaY / 200)));
      player.volume(newVol);
      hint.innerText = `Volume: ${Math.round(newVol * 100)}%`;
    }
    hint.style.display = 'block';
  });
  wrapper.addEventListener('touchend', () => { setTimeout(() => hint.style.display = 'none', 1000); });
}

function shareApp() { if (navigator.share) navigator.share({ title: 'Avia TV', url: window.location.href }); }
</script>
</body>
</html>
