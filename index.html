<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Avia TV - Premium Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; --bg: #050505; --card-bg: rgba(255, 255, 255, 0.03); 
      --card-border: rgba(255, 255, 255, 0.08); --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

    body { 
      margin: 0; padding: 0; background: radial-gradient(circle at top center, #111b21 0%, var(--bg) 100%);
      color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; 
    }

    /* Fullscreen logic */
    .vjs-fullscreen #brand-header, .vjs-fullscreen #ticker, .vjs-fullscreen header, .vjs-fullscreen #content-area { display: none !important; }

    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.9); 
      backdrop-filter: blur(25px); z-index: 1000; border-bottom: 1px solid var(--card-border); 
    }
    
    .brand-header { padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title-new { 
      font-size: 20px; font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(to right, var(--primary), #fff, var(--primary));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 6px;
    }
    .brand-title-new i { font-size: 18px; color: var(--primary); filter: drop-shadow(0 0 5px var(--primary)); }

    #online-status { 
      font-size: 11px; color: var(--online); font-weight: 800; background: rgba(76, 175, 80, 0.1); 
      padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; border: 1px solid rgba(76, 175, 80, 0.2); 
    }
    .online-dot { width: 7px; height: 7px; background: var(--online); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .video-container { 
      position: relative; width: 100%; aspect-ratio: 16/9; max-width: 1000px; margin: 0 auto; 
      background: #000; box-shadow: 0 10px 40px rgba(0, 229, 255, 0.1);
      touch-action: none; 
    }
    .video-js { width: 100% !important; height: 100% !important; }
    
    #ticker { background: rgba(255,255,255,0.02); padding: 5px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 25s linear infinite; white-space: nowrap; color: #bbb; }
    .ticker-content a { color: var(--primary); text-decoration: underline; font-weight: 900; cursor: pointer; }

    header { padding: 12px; }

    /* **UPDATED: Slim and Slimmer Action Buttons** */
    .action-btns { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 6px; /* Slightly reduced gap */
      margin-bottom: 12px; /* Slightly reduced margin */
    }
    .rect-btn { 
      height: 40px; /* **Much smaller height** */
      border-radius: 8px; /* Slightly smaller border radius */
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      background: rgba(255, 255, 255, 0.02); /* More subtle background */
      border: 1px solid var(--card-border); color: #fff; cursor: pointer; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; gap: 2px; /* Reduced gap */
    }
    .rect-btn i { font-size: 12px; } /* **Smaller icons** */
    .rect-btn span { font-size: 8px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.3px; opacity: 0.6; } /* **Smaller and slimmer text** */
    .rect-btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.08); }
    
    .btn-rotate { background: linear-gradient(135deg, var(--primary), #00b8d4); color: #000; border: none; }
    .btn-rotate span { color: #000; font-weight: 600; opacity: 1; }

    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: white; padding: 10px 15px; border-radius: 12px; font-size: 13px; }
    #count { font-size: 10px; color: var(--primary); font-weight: 800; background: rgba(0, 229, 255, 0.1); padding: 5px 10px; border-radius: 8px; }

    .tabs { display: flex; gap: 5px; width: 100%; }
    .tab-btn { 
      flex: 1; padding: 7px 2px; background: var(--card-bg); border: 1px solid var(--card-border); 
      color: #888; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 4px 10px rgba(0, 229, 255, 0.2); }

    #content-area { margin-top: 400px; transition: margin-top 0.3s; } /* Adjust margin due to smaller buttons */
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 12px; padding: 15px; }
    .channel-card { 
      background: var(--card-bg); border-radius: 18px; padding: 15px 8px; text-align: center; 
      border: 1px solid var(--card-border); transition: 0.4s; position: relative; backdrop-filter: blur(10px);
    }
    .channel-card:hover { transform: translateY(-5px); border-color: var(--primary); background: rgba(255,255,255,0.06); }
    
    /* **UPDATED: Smaller Star Icon** */
    .fav-star { 
      position: absolute; top: 6px; right: 6px; /* Slightly adjusted position */
      font-size: 12px; /* **Much smaller star** */
      color: rgba(255,255,255,0.1); 
    }
    .fav-star.active { color: var(--star); text-shadow: 0 0 5px var(--star); } /* Subtler text shadow */
    
    .channel-logo { height: 40px; margin-bottom: 8px; object-fit: contain; }
    .channel-name { font-size: 10px; color: #ccc; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .footer-area { 
      padding: 30px 0 100px 0; text-align: center; background: linear-gradient(to top, rgba(0,0,0,0.4), transparent); 
      border-top: 1px solid var(--card-border); margin-top: 20px;
    }
    .footer-line { width: 30px; height: 1px; background: var(--card-border); margin: 0 auto 10px auto; }
    .dev-credits { font-size: 9px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .dev-name { font-weight: 900; color: #fff; text-shadow: 0 0 5px var(--primary); }

    .gesture-indicator { 
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.8); 
      color: var(--primary); padding: 12px 20px; border-radius: 30px; font-size: 15px; 
      font-weight: 800; z-index: 2147483647; display: none; border: 1px solid var(--primary); 
      pointer-events: none;
    }
    #vol-indicator { right: 15px; } #bri-indicator { left: 15px; }
    #brightness-overlay { 
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: black; opacity: 0; pointer-events: none; z-index: 2147483646; 
    }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body>

<div id="top-section">
  <div class="brand-header">
    <div class="brand-title-new"><i class="fa-solid fa-tv"></i> AVIA TV</div>
    <div id="online-status"><div class="online-dot"></div> <span id="user-count">0</span></div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
    <div id="brightness-overlay"></div>
    <div id="vol-indicator" class="gesture-indicator">🔊 100%</div>
    <div id="bri-indicator" class="gesture-indicator">☀️ 100%</div>
  </div>

  <div id="ticker">
    <div class="ticker-content">
      <span id="now-playing-text" style="color: var(--primary); font-weight: 900;">চ্যানেল নির্বাচন করুন...</span>
      <span style="margin-left: 30px;">
        📢 পরামর্শ বা অভিযোগের জন্য টেলিগ্রাম গ্রুপে যুক্ত হোন: 
        <a href="https://t.me/techbd_group" target="_blank">TECH BD GROUP</a>
      </span>
    </div>
  </div>

  <header id="main-header">
    <div class="action-btns">
      <button onclick="window.location.reload()" class="rect-btn">
        <i class="fa-solid fa-rotate-right" style="color:var(--refresh)"></i>
        <span>Refresh</span>
      </button>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn">
        <i class="fa-brands fa-telegram" style="color:var(--tg)"></i>
        <span>Group</span>
      </a>
      <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank" class="rect-btn">
        <i class="fa-solid fa-cloud-arrow-down" style="color:var(--apk)"></i>
        <span>Get App</span>
      </a>
      <button onclick="toggleRotateManual()" class="rect-btn btn-rotate">
        <i class="fa-solid fa-expand"></i>
        <span>Fullscreen</span>
      </button>
    </div>
    
    <div class="search-row">
      <input type="text" id="search" placeholder="Search Channels...">
      <span id="count">0 CH</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">🔥 ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">⚽ SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">🇧🇩 BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং...</div>
  
  <div class="footer-area">
    <div class="footer-line"></div>
    <div class="dev-credits">Developed by <span class="dev-name">Sohel Tanver</span></div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [];
let player;

function adjustMargin() {
  const h = document.getElementById('top-section').offsetHeight;
  document.getElementById('content-area').style.marginTop = (h + 10) + 'px';
}

async function toggleRotateManual() {
  if (!player) return;
  if (!player.isFullscreen()) {
    player.requestFullscreen();
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  } else player.exitFullscreen();
}

document.getElementById("search").addEventListener("input", function() {
  const val = this.value.toLowerCase().trim();
  renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(val)));
});

function filterCat(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (cat === 'all') renderChannels(allChannels);
  else if (cat === 'fav') renderChannels(allChannels.filter(ch => favorites.includes(ch.id)));
  else renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(cat.toLowerCase())));
}

function toggleFav(event, id) {
  event.stopPropagation();
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  localStorage.setItem('myFavs', JSON.stringify(favorites));
  event.target.classList.toggle('active');
}

function playStream(url, name) {
  document.getElementById("now-playing-text").innerText = "দেখছেন: " + name;
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play().catch(() => {});
  document.getElementById('player-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function init() {
  player = videojs('v-player', { fluid: true, userActions: { click: false } });
  
  let startY, startVal, isBrightness, isMoving = false;
  const wrapper = player.el();
  const briOverlay = document.getElementById('brightness-overlay');
  const volInd = document.getElementById('vol-indicator');
  const briInd = document.getElementById('bri-indicator');

  wrapper.appendChild(briOverlay);
  wrapper.appendChild(volInd);
  wrapper.appendChild(briInd);
  
  wrapper.addEventListener('touchstart', (e) => {
    isMoving = false; 
    startY = e.touches[0].pageY;
    isBrightness = (e.touches[0].pageX - wrapper.getBoundingClientRect().left) < wrapper.offsetWidth / 2;
    startVal = isBrightness ? (1 - parseFloat(briOverlay.style.opacity || 0)) : player.volume();
  });

  wrapper.addEventListener('touchmove', (e) => {
    isMoving = true;
    if (e.cancelable) e.preventDefault();
    const diff = (startY - e.touches[0].pageY) / 150;
    let newVal = Math.min(Math.max(startVal + diff, 0), 1);
    
    if (isBrightness) {
      briOverlay.style.opacity = 1 - newVal;
      briInd.innerText = `☀️ ${Math.round(newVal * 100)}%`;
      briInd.style.display = 'block';
    } else {
      player.volume(newVal);
      volInd.innerText = `🔊 ${Math.round(newVal * 100)}%`;
      volInd.style.display = 'block';
    }
  }, { passive: false });

  wrapper.addEventListener('touchend', () => {
    if (!isMoving) player.paused() ? player.play() : player.pause();
    setTimeout(() => { volInd.style.display = 'none'; briInd.style.display = 'none'; }, 800);
  });

  try {
    const res = await fetch(playlistUrl);
    const data = await res.text();
    allChannels = parseM3U(data);
    renderChannels(allChannels);
    if(allChannels.length > 0) {
        player.src({ src: allChannels[0].url, type: 'application/x-mpegURL' });
        document.getElementById("now-playing-text").innerText = "দেখছেন: " + allChannels[0].name;
    }
    setInterval(adjustMargin, 500);
  } catch(e) { console.error(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
      cur.id = btoa(unescape(encodeURIComponent(cur.name || "")));
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card" onclick="playStream('${ch.url}', '${ch.name}')">
      <i class="fa-solid fa-star fav-star ${favorites.includes(ch.id) ? 'active' : ''}" onclick="toggleFav(event, '${ch.id}')"></i>
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
  document.getElementById("count").textContent = list.length + " CH";
}

init();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
  const firebaseConfig = { databaseURL: "https://avia-tv-default-rtdb.firebaseio.com/" };
  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const onlineRef = ref(db, 'online_users');
    const myRef = push(onlineRef);
    set(myRef, true);
    onDisconnect(myRef).remove();
    onValue(onlineRef, (s) => {
      const count = s.val() ? Object.keys(s.val()).length : 0;
      document.getElementById("user-count").innerText = count;
    });
  } catch (e) {}
</script>
</body>
</html>
