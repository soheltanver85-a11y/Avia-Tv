<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; 
      --bg: #050505; 
      --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); 
      --star: #ffd700; 
      --online: #4CAF50; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.8);
      --sidebar-bg: #111111;
    }

    body.light-mode {
      --bg: #f0f2f5;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --header-bg: rgba(240, 242, 245, 0.9);
      --card-border: rgba(0, 0, 0, 0.1);
      --sidebar-bg: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; padding: 0; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden; 
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    /* --- Sidebar Styles --- */
    .sidebar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
      background: var(--sidebar-bg); z-index: 2000;
      transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
      padding: 20px; border-right: 1px solid var(--card-border);
    }
    .sidebar.active { left: 0; }
    .sidebar-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 1999; display: none;
      backdrop-filter: blur(4px);
    }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .sidebar-logo { font-size: 20px; font-weight: 900; color: var(--primary); }
    .close-btn { font-size: 22px; cursor: pointer; color: var(--text); }
    
    .menu-section-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 8px 5px; }
    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 15px;
      color: var(--text); text-decoration: none; border-radius: 12px;
      transition: 0.3s; margin-bottom: 5px; font-size: 14px;
    }
    .menu-item:hover { background: var(--card-bg); color: var(--primary); }
    .badge-live { background: #ff4081; color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: auto; animation: pulse-animation 1.5s infinite; }

    /* --- Top Navigation --- */
    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; 
      background: var(--header-bg); backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px); z-index: 1000; 
      border-bottom: 1px solid var(--card-border); 
    }

    .brand-header { padding: 8px 15px; display: flex; align-items: center; justify-content: space-between; }
    .menu-toggle { font-size: 20px; cursor: pointer; color: var(--text); padding: 5px; }
    .brand-title-new { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: #fff; }
    
    .header-right-side { display: flex; align-items: center; gap: 10px; }
    .theme-switch {
      width: 40px; height: 20px; background: #333; border-radius: 20px; cursor: pointer;
      display: flex; align-items: center; padding: 0 3px; position: relative;
    }
    .theme-switch .dot { width: 14px; height: 14px; background: #fff; border-radius: 50%; transition: 0.3s; display: flex; align-items: center; justify-content: center; font-size: 9px; }
    body.light-mode .theme-switch .dot { transform: translateX(20px); }

    .online-counter-box {
      display: inline-flex; align-items: center; gap: 5px; background: rgba(76, 175, 80, 0.1);
      color: var(--online); padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .online-dot-blink { width: 6px; height: 6px; background-color: var(--online); border-radius: 50%; animation: pulse-animation 1.5s infinite; }

    /* --- Video Player & MX Controls --- */
    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; max-width: 1000px; margin: 0 auto; background: #000; touch-action: none; overflow: hidden; }
    .video-js { width: 100% !important; height: 100% !important; }
    .vjs-gesture-hint {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.7); color: var(--primary); padding: 10px 20px;
        border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 100;
        display: none; pointer-events: none; border: 1px solid var(--primary);
    }

    #ticker { background: rgba(255,255,255,0.02); padding: 6px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 30s linear infinite; white-space: nowrap; color: var(--text); }

    header { padding: 10px 15px; }
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px; border-radius: 10px; font-size: 13px; }

    .tabs { display: flex; gap: 5px; }
    .tab-btn { flex: 1; padding: 8px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    #content-area { margin-top: 380px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; padding: 10px; }
    
    .channel-card { background: var(--card-bg); border-radius: 15px; padding: 12px 5px; text-align: center; border: 1px solid var(--card-border); transition: 0.3s; position: relative; }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
    .channel-logo { height: 40px; margin-bottom: 5px; object-fit: contain; }
    .channel-name { font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fav-star { position: absolute; top: 6px; right: 6px; font-size: 11px; color: rgba(128,128,128,0.3); }
    .fav-star.active { color: var(--star); }

    @keyframes pulse-animation { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
  </style>
</head>
<body onload="init()">

<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">AVIA TV MENU</div>
    <div class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></div>
  </div>

  <div class="menu-section-label">EXCLUSIVE</div>
  <a href="#" class="menu-item"><i class="fa-solid fa-bolt" style="color:#ff4081"></i><span>FanCode Live</span><span class="badge-live">LIVE</span></a>

  <div class="menu-section-label">COMMUNICATE</div>
  <a href="https://t.me/techbd_group" target="_blank" class="menu-item"><i class="fa-brands fa-telegram" style="color:#24A1DE"></i><span>Telegram Group</span></a>
  <a href="#" class="menu-item"><i class="fa-solid fa-headset" style="color:#3DDC84"></i><span>Contact Us</span></a>
  <a href="javascript:shareApp()" class="menu-item"><i class="fa-solid fa-share-nodes"></i><span>Share App</span></a>

  <div class="menu-section-label">SETTINGS</div>
  <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank" class="menu-item"><i class="fa-solid fa-download" style="color:#ffa500"></i><span>Update App (APK)</span></a>
  <a href="javascript:manualRefresh()" class="menu-item"><i class="fa-solid fa-rotate"></i><span>Refresh List</span></a>
  <a href="#" class="menu-item" style="opacity:0.6"><i class="fa-solid fa-copyright"></i><span>Copyright Info</span></a>
</div>

<div id="top-section">
  <div class="brand-header">
    <div class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered"></i></div>
    <div class="brand-title-new">AVIA TV</div>
    <div class="header-right-side">
      <div class="theme-switch" onclick="toggleTheme()"><div class="dot"><i id="theme-icon" class="fa-solid fa-moon"></i></div></div>
      <div class="online-counter-box"><div class="online-dot-blink"></div>ONLINE: <span id="user-count">0</span></div>
    </div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
    <div id="gesture-hint" class="vjs-gesture-hint"></div>
  </div>

  <div id="ticker">
    <div class="ticker-content">🚀 Welcome to <b>Avia TV</b> | Playing: <span id="now-playing-ticker">Select Channel...</span> | Enjoy Live Streaming without buffering!</div>
  </div>

  <header>
    <div class="search-row">
      <input type="text" id="search" placeholder="Search Channels..." oninput="handleSearch(this.value)">
      <button class="tab-btn" style="flex:0.2" onclick="manualRefresh()"><i id="refresh-icon" class="fa-solid fa-rotate"></i></button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">Loading Channels...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
  const firebaseConfig = { databaseURL: "https://avia-tv-default-rtdb.firebaseio.com/" };
  try {
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const onlineRef = ref(db, 'online_users'); 
    const myRef = push(onlineRef);
    set(myRef, true);
    onDisconnect(myRef).remove();
    onValue(onlineRef, (snapshot) => {
      const count = snapshot.val() ? Object.keys(snapshot.val()).length : 0;
      document.getElementById("user-count").innerText = count;
    });
  } catch (e) { console.error(e); }
</script>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
const basePlaylistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";
let allChannels = [], favorites = JSON.parse(localStorage.getItem('myFavs')) || [];
let player, currentUrl = "", brightness = 100;

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  sidebar.classList.toggle('active');
  overlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
}

// MX Player Gesture Controls
function setupMXControls(player) {
    const wrapper = document.getElementById('player-wrapper');
    const hint = document.getElementById('gesture-hint');
    let startX, startY, startVol, startBright, isMoving = false;

    wrapper.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        startVol = player.volume(); startBright = brightness; isMoving = false;
    });

    wrapper.addEventListener('touchmove', (e) => {
        isMoving = true;
        const deltaY = startY - e.touches[0].clientY;
        const isLeft = startX < (wrapper.clientWidth / 2);
        if (isLeft) {
            brightness = Math.min(200, Math.max(10, startBright + (deltaY / 2)));
            wrapper.style.filter = `brightness(${brightness}%)`;
            showHint(`Brightness: ${Math.round(brightness)}%`);
        } else {
            let newVol = Math.min(1, Math.max(0, startVol + (deltaY / 200)));
            player.volume(newVol);
            showHint(`Volume: ${Math.round(newVol * 100)}%`);
        }
        if (e.cancelable) e.preventDefault();
    }, { passive: false });

    wrapper.addEventListener('touchend', () => {
        setTimeout(() => hint.style.display = 'none', 600);
    });
    function showHint(text) { hint.innerText = text; hint.style.display = 'block'; }
}

async function manualRefresh() {
    const icon = document.getElementById("refresh-icon");
    icon.classList.add("fa-spin");
    await fetchChannels();
    setTimeout(() => icon.classList.remove("fa-spin"), 1000);
}

async function fetchChannels() {
    try {
        const res = await fetch(basePlaylistUrl + "?t=" + Date.now());
        const data = await res.text();
        allChannels = parseM3U(data);
        renderChannels(allChannels);
        if(!currentUrl && allChannels.length > 0) playStream(allChannels[0].url, allChannels[0].name);
    } catch(e) { console.error(e); }
}

function parseM3U(data) {
  const lines = data.split("\n"), list = [];
  let cur = {};
  lines.forEach(l => {
    if (l.startsWith("#EXTINF")) {
      cur.name = l.split(",")[1]?.trim();
      cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
      cur.id = btoa(unescape(encodeURIComponent(cur.name || "")));
    } else if (l.startsWith("http")) { 
      cur.url = l.trim(); if(cur.name) list.push({...cur}); cur = {}; 
    }
  });
  return list;
}

function renderChannels(list) {
  const grid = document.getElementById("channelList");
  grid.innerHTML = list.map(ch => `
    <div class="channel-card ${currentUrl === ch.url ? 'playing' : ''}" onclick="playStream('${ch.url}', '${ch.name}')">
      <i class="fa-solid fa-star fav-star ${favorites.includes(ch.id) ? 'active' : ''}" onclick="toggleFav(event, '${ch.id}')"></i>
      <img src="${ch.logo}" class="channel-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/716/716429.png'">
      <div class="channel-name">${ch.name}</div>
    </div>`).join('');
}

function playStream(url, name) {
  currentUrl = url;
  document.getElementById("now-playing-ticker").innerText = name;
  player.src({ src: url, type: 'application/x-mpegURL' });
  player.play().catch(()=>{});
  renderChannels(allChannels);
}

function handleSearch(val) {
    renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(val.toLowerCase())));
}

function filterCat(cat, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (cat === 'all') renderChannels(allChannels);
  else if (cat === 'fav') renderChannels(allChannels.filter(ch => favorites.includes(ch.id)));
  else renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(cat.toLowerCase())));
}

function toggleFav(event, id) {
  event.stopPropagation();
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  localStorage.setItem('myFavs', JSON.stringify(favorites));
  event.target.classList.toggle('active');
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    document.getElementById('theme-icon').className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}

function shareApp() {
    if (navigator.share) navigator.share({ title: 'Avia TV', url: window.location.href });
}

async function init() {
  player = videojs('v-player', { fluid: true, responsive: true });
  setupMXControls(player);
  await fetchChannels();
  setInterval(() => {
    const h = document.getElementById('top-section').offsetHeight;
    document.getElementById('content-area').style.marginTop = (h + 5) + 'px';
  }, 500);
}
</script>
</body>
</html>
