<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Avia TV - Live Streaming</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    :root { 
      --primary: #00e5ff; 
      --bg: #050505; 
      --card-bg: rgba(255, 255, 255, 0.05); 
      --card-border: rgba(255, 255, 255, 0.1); 
      --accent: #ff4081; --star: #ffd700; 
      --tg: #24A1DE; --apk: #3DDC84; --online: #4CAF50; --refresh: #ffa500; --text: #ffffff;
      --header-bg: rgba(10, 10, 10, 0.85);
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
      margin: 0; padding: 0; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden; 
      min-height: 100vh;
    }

    /* --- Side Navigation --- */
    .sidenav {
      height: 100%; width: 0; position: fixed; z-index: 2000;
      top: 0; left: 0; background-color: #0a0a0a; overflow-x: hidden;
      transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); padding-top: 60px;
      box-shadow: 5px 0 15px rgba(0,0,0,0.5); border-right: 1px solid var(--card-border);
    }
    .sidenav a, .menu-item-div {
      padding: 12px 25px; text-decoration: none; font-size: 15px;
      color: #ccc; display: flex; align-items: center; gap: 15px; transition: 0.3s;
    }
    .sidenav .closebtn { position: absolute; top: 15px; right: 25px; font-size: 30px; color: #818181; }
    .menu-section-label { padding: 20px 25px 10px; font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }

    /* --- Header & Logo Design --- */
    #top-section { 
      position: fixed; top: 0; left: 0; width: 100%; 
      background: var(--header-bg); backdrop-filter: blur(20px); 
      z-index: 1000; border-bottom: 1px solid var(--card-border); 
    }
    .brand-header { padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; }
    
    .brand-title-new { 
      font-size: 22px; font-weight: 900; letter-spacing: 1.5px; 
      text-transform: uppercase;
      background: linear-gradient(90deg, #00e5ff, #ffffff, #00e5ff);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
      animation: shine 3s linear infinite;
      filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.3));
    }
    @keyframes shine { to { background-position: 200% center; } }

    /* --- Three Dot Menu --- */
    .menu-trigger-btn {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 50%; background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border); transition: 0.3s;
    }
    .menu-trigger-btn:active { transform: scale(0.9); background: rgba(0,229,255,0.1); }

    .header-right-side { display: flex; align-items: center; gap: 10px; }

    .online-counter-box {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(76, 175, 80, 0.1);
      color: var(--online); padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; border: 1px solid rgba(76, 175, 80, 0.2);
    }
    .online-dot-blink { width: 6px; height: 6px; background-color: var(--online); border-radius: 50%; animation: pulse-animation 1.5s infinite; }

    /* --- Video & UI Elements --- */
    .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
    .video-js { width: 100% !important; height: 100% !important; }
    
    #ticker { background: rgba(255,255,255,0.02); padding: 6px 0; font-size: 10px; border-bottom: 1px solid var(--card-border); overflow: hidden; }
    .ticker-content { display: inline-block; animation: marquee 30s linear infinite; white-space: nowrap; color: var(--text); }

    header { padding: 12px; }
    .action-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .rect-btn { 
      height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; 
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); 
      cursor: pointer; text-decoration: none; gap: 6px; transition: 0.3s; font-size: 9px; font-weight: 600;
    }
    .btn-rotate { background: var(--primary); color: #000; border: none; font-weight: 800; }

    .search-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    #search { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px 15px; border-radius: 12px; font-size: 13px; }
    
    .tabs { display: flex; gap: 6px; }
    .tab-btn { flex: 1; padding: 8px 5px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); opacity: 0.7; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: #000; opacity: 1; }

    #content-area { margin-top: 400px; padding-bottom: 50px; }
    #channelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; padding: 15px; }
    
    .channel-card { background: var(--card-bg); border-radius: 18px; padding: 15px 8px; text-align: center; border: 1px solid var(--card-border); transition: 0.3s; }
    .channel-card.playing { border-color: var(--primary); background: rgba(0, 229, 255, 0.1); }
    .channel-logo { height: 40px; margin-bottom: 8px; object-fit: contain; }
    .channel-name { font-size: 10px; font-weight: 600; }

    .footer-area { padding: 30px; text-align: center; border-top: 1px solid var(--card-border); }
    .dev-credits { font-size: 9px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; }

    @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    @keyframes pulse-animation { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .menu-overlay { display: none; position: fixed; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.7); z-index: 1999; backdrop-filter: blur(3px); }
  </style>
</head>
<body onload="init()">

<div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <div class="menu-section-label">Main Menu</div>
  <a href="#"><i class="fa-solid fa-bolt" style="color: #ff4081;"></i> Exclusive Live</a>
  <a href="https://t.me/techbd_group" target="_blank"><i class="fa-brands fa-telegram" style="color:#24A1DE"></i> Telegram Group</a>
  <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank"><i class="fa-solid fa-download" style="color:#3DDC84"></i> Download APK</a>
  <div class="menu-section-label">Other</div>
  <a href="javascript:void(0)" onclick="shareApp()"><i class="fa-solid fa-share-nodes"></i> Share App</a>
  <a href="javascript:void(0)" onclick="window.location.reload()"><i class="fa-solid fa-rotate"></i> Reload Page</a>
</div>

<div id="menuOverlay" class="menu-overlay" onclick="closeNav()"></div>

<div id="top-section">
  <div class="brand-header">
    <div class="brand-logo-container">
        <div class="brand-title-new">AVIA TV</div>
    </div>
    
    <div class="header-right-side">
      <div class="online-counter-box">
        <div class="online-dot-blink"></div>
        <span>ONLINE: <span id="user-count">0</span></span>
      </div>
      <div class="menu-trigger-btn" onclick="openNav()">
          <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>
    </div>
  </div>

  <div class="video-container" id="player-wrapper">
    <video id="v-player" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>
  </div>

  <div id="ticker">
    <div class="ticker-content">
      <b>এখন দেখছেন:</b> <span id="now-playing-ticker">চ্যানেল নির্বাচন করুন...</span> | 📡 Avia TV তে বাফারিং ছাড়াই লাইভ স্ট্রিম উপভোগ করুন | 📢 জয়েন করুন: TECH BD GROUP
    </div>
  </div>

  <header>
    <div class="action-btns">
      <button onclick="manualRefresh()" class="rect-btn"><i class="fa-solid fa-rotate-right" style="color:var(--refresh)"></i><span>Refresh</span></button>
      <a href="https://t.me/techbd_group" target="_blank" class="rect-btn"><i class="fa-brands fa-telegram" style="color:var(--tg)"></i><span>Group</span></a>
      <a href="https://www.mediafire.com/file/mkby3e9skeyfz8n/Avia+Tv+1.0.0.apk/file" target="_blank" class="rect-btn"><i class="fa-solid fa-download" style="color:var(--apk)"></i><span>APK</span></a>
      <button onclick="player.requestFullscreen()" class="rect-btn btn-rotate"><i class="fa-solid fa-expand"></i><span>Full</span></button>
    </div>
    
    <div class="search-row">
        <input type="text" id="search" placeholder="Search Channels..." oninput="handleSearch(this.value)">
        <span id="count" style="font-size:10px; font-weight:800; color:var(--primary)">0 CH</span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="filterCat('all', this)">ALL</button>
      <button class="tab-btn" onclick="filterCat('sports', this)">SPORTS</button>
      <button class="tab-btn" onclick="filterCat('bangla', this)">BANGLA</button>
      <button class="tab-btn" onclick="filterCat('fav', this)">⭐ FAV</button>
    </div>
  </header>
</div>

<div id="content-area">
  <div id="channelList">লোডিং চ্যানেল...</div>
  <div class="footer-area">
    <div class="dev-credits">Developed by <span style="color:var(--primary); font-weight:900">Sohel Tanveer</span></div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set, onDisconnect } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
  const firebaseConfig = { databaseURL: "https://avia-tv-default-rtdb.firebaseio.com/" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const onlineRef = ref(db, 'online_users'); 
  const myRef = push(onlineRef);
  set(myRef, true);
  onDisconnect(myRef).remove();
  onValue(onlineRef, (snapshot) => {
    const count = snapshot.val() ? Object.keys(snapshot.val()).length : 0;
    document.getElementById("user-count").innerText = count;
  });
</script>

<script>
let allChannels = [], player;
const playlistUrl = "https://raw.githubusercontent.com/soheltanver85-a11y/Live-tv/main/Live%20tv";

function openNav() { document.getElementById("mySidenav").style.width = "var(--sidebar-width)"; document.getElementById("menuOverlay").style.display = "block"; }
function closeNav() { document.getElementById("mySidenav").style.width = "0"; document.getElementById("menuOverlay").style.display = "none"; }

async function fetchChannels() {
    try {
        const res = await fetch(playlistUrl + "?t=" + Date.now());
        const data = await res.text();
        allChannels = parseM3U(data);
        renderChannels(allChannels);
        if (allChannels.length > 0) playStream(allChannels[0].url, allChannels[0].name);
    } catch(e) { console.error(e); }
}

function parseM3U(data) {
    const lines = data.split("\n"), list = [];
    let cur = {};
    lines.forEach(l => {
        if (l.startsWith("#EXTINF")) {
            cur.name = l.split(",")[1]?.trim();
            cur.logo = l.match(/tvg-logo="([^"]+)"/)?.[1] || "https://cdn-icons-png.flaticon.com/512/716/716429.png";
        } else if (l.startsWith("http")) {
            cur.url = l.trim();
            if(cur.name) list.push({...cur});
            cur = {};
        }
    });
    return list;
}

function renderChannels(list) {
    const container = document.getElementById("channelList");
    container.innerHTML = list.map(ch => `
        <div class="channel-card" onclick="playStream('${ch.url}', '${ch.name}')">
            <img class="channel-logo" src="${ch.logo}" alt="">
            <div class="channel-name">${ch.name}</div>
        </div>
    `).join('');
    document.getElementById("count").innerText = list.length + " CH";
}

function playStream(url, name) {
    document.getElementById("now-playing-ticker").innerText = name;
    player.src({ src: url, type: 'application/x-mpegURL' });
    player.play().catch(()=>{});
}

function handleSearch(val) {
    const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(val.toLowerCase()));
    renderChannels(filtered);
}

function init() {
    player = videojs('v-player');
    fetchChannels();
    setInterval(() => {
        const h = document.getElementById('top-section').offsetHeight;
        document.getElementById('content-area').style.marginTop = h + 'px';
    }, 500);
}

function shareApp() {
    if (navigator.share) {
        navigator.share({ title: 'Avia TV', url: window.location.href });
    } else {
        alert("Link Copied: " + window.location.href);
    }
}
</script>
</body>
</html>
